    const OD_ACTIVE = new Set(['pending', 'in_progress', 'inProgress', 'scheduled', 'accepted']);
    const OD_STATUS_CLASS = { in_progress: 'inProgress', inProgress: 'inProgress', pending: 'accepted', scheduled: 'accepted', accepted: 'accepted' };
    const OD_STATUS_LABEL = { in_progress: 'In Progress', inProgress: 'In Progress', pending: 'Pending', scheduled: 'Scheduled', accepted: 'Accepted' };

    function riderName(req) {
      const r = req.rider;
      if (!r) return 'Rider';
      return [r.firstName, r.lastName].filter(Boolean).join(' ') || 'Rider';
    }

    function accessTags(req) {
      const features = req.accessibilityFeatures || [];
      if (!features.length) return '';
      return features.map(f => {
        const label = typeof f === 'object' ? (f.type || JSON.stringify(f)) : f;
        return `<span class="access-tag">${escHtml(label)}</span>`;
      }).join('');
    }

    function renderTrips() {
      const list = document.getElementById('trips-list');
      document.getElementById('trips-updated').textContent = new Date().toLocaleTimeString();
      // { sortTs, html } for every card, Spare + OnDemand together, so the whole board
      // ends up in one chronological order -- next-relevant time for each ride: its
      // pickup time normally, its dropoff time once the rider's already aboard.
      const items = [];
      const tripSortTs = req => (req.status === 'inProgress'
        ? (req.dropoffEta || req.scheduledDropoffTs)
        : (req.pickupEta || req.scheduledPickupTs)) || Infinity;
      // vehicleId -> driver name, from the duty roster, so a trip card can name the
      // driver right next to the van.
      const spareDriverByVid = {};
      for (const d of spareDuties) {
        const vid = d.vehicleId || (d.vehicle && d.vehicle.id);
        const dn = [d.driver && d.driver.firstName, d.driver && d.driver.lastName].filter(Boolean).join(' ');
        if (vid && dn) spareDriverByVid[vid] = dn;
      }
      const stopOrder = computeStopOrderLookup();
      for (const req of spareTrips) {
        const name   = riderName(req);
        const status = req.status || 'unknown';
        const pickup  = req.scheduledPickupAddress  || req.requestedPickupAddress  || '—';
        const dropoff = req.scheduledDropoffAddress || req.requestedDropoffAddress || '—';
        // Once the rider's actually been picked up, Spare stamps pickupCompletedTs --
        // show that real time (labeled "Picked up") instead of a now-moot ETA.
        const pickedUp = Number.isFinite(req.pickupCompletedTs);
        const puLabel = pickedUp ? 'Picked up' : 'PU';
        const puEta = pickedUp
          ? fmtTime(req.pickupCompletedTs)
          : (req.pickupEta ? fmtTime(req.pickupEta) : fmtTime(req.scheduledPickupTs));
        const doEta = req.dropoffEta ? fmtTime(req.dropoffEta) : fmtTime(req.scheduledDropoffTs);
        const notes  = req.notes ? `<div class="addr trip-note" style="margin-top:.25rem">${svgIcon('note')} ${escHtml(req.notes)}</div>` : '';
        const riders = req.numRiders ? ` · ${req.numRiders} rider${req.numRiders>1?'s':''}` : '';
        const riderPhoneRaw = req.rider && req.rider.phoneNumber ? String(req.rider.phoneNumber).trim() : '';
        const phoneLine = riderPhoneRaw
          ? `<div class="addr trip-phone" style="font-size:.72rem;margin-bottom:.15rem">${svgIcon('phone')} <a href="tel:${escHtml(riderPhoneRaw.replace(/[^\d+]/g, ''))}">${escHtml(formatPhone(riderPhoneRaw))}</a></div>`
          : '';
        const van = req.vehicleId ? (vehicleData[req.vehicleId] || {}) : null;
        const vanLabel = van ? (van.identifier || 'Van') : null;
        const vanColor = van ? getVanColor(vanLabel, van.markerColor || '#7c3aed') : null;
        const vanDriver = req.vehicleId ? spareDriverByVid[req.vehicleId] : null;
        const vanLine = van
          ? `<div class="addr" style="color:#aaa;font-size:.72rem;margin-bottom:.15rem">${svgIcon('van', vanColor)} <span style="color:${vanColor};font-weight:600">${escHtml(vanLabel)}</span>${vanDriver ? ` · ${escHtml(vanDriver)}` : ''}</div>`
          : `<div class="addr" style="color:#666;font-size:.72rem;margin-bottom:.15rem;font-style:italic">Not yet assigned to a van</div>`;
        const bookedPickupTs = req.requestedPickupTs || req.scheduledPickupTs;
        const leadTime = req.createdAt && bookedPickupTs ? formatLeadTime(bookedPickupTs - req.createdAt) : null;
        const bookedLine = req.createdAt
          ? `<div class="addr" style="color:#777;font-size:.68rem;margin-top:.3rem">${svgIcon('calendar')} Booked ${leadTime ? `${leadTime} ahead` : `at ${fmtTime(req.createdAt)}`}</div>`
          : '';
        const intentLabel = rideIntentLabel(req);
        const intentLine = intentLabel ? `<div class="addr" style="color:#777;font-size:.68rem">${svgIcon('target')} ${escHtml(intentLabel)}</div>` : '';
        // Same numbers shown on the map's stop pins, so a card can be matched to its pin
        // (and vice versa) without hunting across the map for the right color/marker.
        const badgeColor = vanColor || '#7c3aed';
        const puBadge = stopOrderBadgeHtml(stopOrder[`${req.id}-Pickup`], badgeColor);
        const doBadge = stopOrderBadgeHtml(stopOrder[`${req.id}-Dropoff`], badgeColor);
        items.push({ sortTs: tripSortTs(req), html: `<div class="trip-card ${status}" style="cursor:pointer" title="Click to show this ride's route on the map" onclick="showRequestRoute('${escHtml(req.id)}')" data-van-source="spare" data-vehicle-id="${escHtml(req.vehicleId || '')}">
          <div class="trip-header">
            <span class="status-pill ${status}">${status}</span>
            <span class="rider-name">${escHtml(name)}${riders}</span>
            <span class="source-badge source-badge--spare" style="margin-left:auto">Spare</span>
          </div>
          <div class="trip-body">
            ${vanLine}
            ${phoneLine}
            <div class="addr">${puBadge}▲ ${escHtml(pickup)}</div>
            <div class="addr">${doBadge}▼ ${escHtml(dropoff)}</div>
            <div class="trip-meta">
              <span><span class="eta-label">${puLabel}</span> <span class="eta-time">${puEta}</span></span>
              <span><span class="eta-label">DO</span> <span class="eta-time">${doEta}</span></span>
            </div>
            ${bookedLine}
            ${intentLine}
            ${notes}
            <div class="access-icons">${accessTags(req)}</div>
          </div>
        </div>` });
      }

      // OnDemand: the schedule feed gives per-stop rows (one pickup + one dropoff per
      // ride, and only the dropoff once a ride is in_progress). Regroup them into one
      // card per ride -- rider, van, phone, both addresses, both times -- to match the
      // Spare cards. The pickup address of an in_progress ride is NOT lost: the backend
      // carries it from rides_map onto the surviving dropoff row (stop.pickupAddress /
      // stop.rides[].pickupAddress).
      const odRides = new Map();
      for (const s of odStops) {
        const rec = (s.rides && s.rides[0]) || {};
        const rs = s.rideStatus || rec.rideStatus || '';
        if (!OD_ACTIVE.has(rs) && rs !== '') continue;
        const key = s.rideId || rec.rideId || `${s.vehicleId}|${(s.riders || []).join(',')}`;
        let r = odRides.get(key);
        if (!r) {
          const odv = odVehicles.find(x => String(x.vehicleId) === String(s.vehicleId));
          r = { riders: (s.riders || []).slice(), vehicleId: s.vehicleId, vehicleName: s.vehicleName,
                vehicleColor: s.vehicleColor, driverName: (odv && odv.driverName) || '',
                status: rs || 'accepted', phone: '',
                pickupTs: null, dropoffTs: null, pickupAddr: '', dropoffAddr: '',
                pickupOrder: null, dropoffOrder: null };
          odRides.set(key, r);
        }
        if (!r.riders.length && s.riders && s.riders.length) r.riders = s.riders.slice();
        if (rs) r.status = rs;
        if (!r.phone) r.phone = s.phone || rec.phone || '';
        if (s.stopType === 'pickup')  { r.pickupAddr  = r.pickupAddr  || s.address; if (Number.isFinite(s.stopTs)) r.pickupTs  = s.stopTs; if (Number.isFinite(s.order)) r.pickupOrder  = s.order; }
        if (s.stopType === 'dropoff') { r.dropoffAddr = r.dropoffAddr || s.address; if (Number.isFinite(s.stopTs)) r.dropoffTs = s.stopTs; if (Number.isFinite(s.order)) r.dropoffOrder = s.order; }
        r.pickupAddr  = r.pickupAddr  || s.pickupAddress  || rec.pickupAddress  || '';
        r.dropoffAddr = r.dropoffAddr || s.dropoffAddress || rec.dropoffAddress || '';
      }
      for (const r of odRides.values()) {
        const cls = OD_STATUS_CLASS[r.status] || 'processing';
        const lbl = OD_STATUS_LABEL[r.status] || (r.status || 'Active');
        const pickedUp = r.status === 'in_progress' || r.status === 'inProgress';
        const name = r.riders.join(', ') || 'Rider';
        const vanColor = r.vehicleColor || '#ec4899';
        const phoneRaw = r.phone ? String(r.phone).trim() : '';
        const phoneLine = phoneRaw
          ? `<div class="addr trip-phone" style="font-size:.72rem;margin-bottom:.15rem">${svgIcon('phone')} <a href="tel:${escHtml(phoneRaw.replace(/[^\d+]/g, ''))}">${escHtml(formatPhone(phoneRaw))}</a></div>`
          : '';
        const puAddr = r.pickupAddr || (pickedUp ? 'Pickup complete' : '—');
        const puLabel = pickedUp ? 'Picked up' : 'PU';
        const puTime = r.pickupTs ? fmtTime(r.pickupTs) : (pickedUp ? svgIcon('check') : '—');
        const doTime = r.dropoffTs ? fmtTime(r.dropoffTs) : '—';
        // Same numbered badges the map's OnDemand stop pins carry (see renderOdStopOrderMarkers).
        const puBadge = stopOrderBadgeHtml(r.pickupOrder, vanColor);
        const doBadge = stopOrderBadgeHtml(r.dropoffOrder, vanColor);
        const sortTs = ((pickedUp ? r.dropoffTs : r.pickupTs) || r.pickupTs || r.dropoffTs || Infinity);
        items.push({ sortTs, html: `<div class="trip-card ${cls}" data-van-source="od" data-vehicle-id="${escHtml(r.vehicleId || '')}">
          <div class="trip-header">
            <span class="status-pill ${cls}">${escHtml(lbl)}</span>
            <span class="rider-name">${escHtml(name)}</span>
            <span class="source-badge source-badge--w2w" style="margin-left:auto">OD</span>
          </div>
          <div class="trip-body">
            <div class="addr" style="color:#aaa;font-size:.72rem;margin-bottom:.15rem">${svgIcon('van', vanColor)} <span style="color:${vanColor};font-weight:600">${escHtml(r.vehicleName || 'Van')}</span>${r.driverName ? ` · ${escHtml(r.driverName)}` : ''}</div>
            ${phoneLine}
            <div class="addr">${puBadge}▲ ${escHtml(puAddr)}</div>
            <div class="addr">${doBadge}▼ ${escHtml(r.dropoffAddr || '—')}</div>
            <div class="trip-meta">
              <span><span class="eta-label">${puLabel}</span> <span class="eta-time">${puTime}</span></span>
              <span><span class="eta-label">DO</span> <span class="eta-time">${doTime}</span></span>
            </div>
          </div>
        </div>` });
      }

      items.sort((a, b) => a.sortTs - b.sortTs);
      const cards = items.map(i => i.html);
      document.getElementById('trip-count').textContent = cards.length;
      list.innerHTML = cards.length ? cards.join('') : '<div class="no-trips">No active trips right now</div>';
      if (selectedVan) applyVanHighlight(false);
    }

    async function fetchTrips() {
      try {
        const res = await fetch('/api/spare/requests');
        if (!res.ok) {
          if (res.status === 503) {
            document.getElementById('trips-list').innerHTML = `<div class="no-trips">${svgIcon('warn')} Spare not configured — set SPARE_API_KEY</div>`;
            return;
          }
          return; // soft-fail: keep last known board
        }
        const trips = await res.json();
        spareTrips = Array.isArray(trips) ? trips : [];
        renderTrips();
        renderStopOrderMarkers();
      } catch (err) {
        console.error('[spare] trips fetch failed:', err);
        // soft-fail: board unchanged
      }
    }

    // ---- Duty roster (combined: Spare duties + W2W OnDemand shifts) ----
    let spareDuties = [];
    let w2wShifts   = [];

    function normalizeName(s) {
      return (s || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    // Do a W2W shift window and a Spare duty window (both in seconds) plausibly refer to
    // the same stretch of work? Allow an hour of slack each way so clocking in a bit
    // early/late relative to the officially-scheduled W2W shift still counts as a match.
    function windowsOverlapWithSlack(aStart, aEnd, bStart, bEnd, slackSec) {
      return (aStart - slackSec) <= bEnd && (bStart - slackSec) <= aEnd;
    }

    function buildDutyCard(r) {
      const srcBadge = r.source === 'spare'
        ? `<span class="source-badge source-badge--spare">Spare</span>${r.detail ? ` <span style="color:var(--text-faint);font-size:.7rem">${escHtml(r.detail)}</span>` : ''}`
        : `<span class="source-badge source-badge--w2w">${r.odActive ? 'OD' : 'W2W'}</span>${r.detail ? ` <span style="color:var(--text-faint);font-size:.7rem">${escHtml(r.detail)}</span>` : ''}`;
      const statusPill = r.source === 'spare'
        ? (r.onBreakSince
            ? `<span class="duty-status onBreak">On break</span>`
            : `<span class="duty-status ${r.status}">${escHtml(humanizeStatus(r.status))}</span>`)
        : (r.odActive
            ? `<span class="duty-status inProgress">Active</span>`
            : `<span class="duty-status scheduled" style="background:#1a2a1e;color:#6ee7b7">Shift</span>`);
      const assignLine = r.vanColor
        ? `${svgIcon('van', r.vanColor)} <span style="color:${r.vanColor};font-weight:600">${escHtml(r.assignment)}</span>`
        : (r.source === 'w2w'
          ? `<span style="color:var(--accent-label)">${escHtml(r.assignment)}</span>`
          : escHtml(r.assignment));

      // "Shift" = officially scheduled in WhenToWork. "Duty" = the actual Spare duty
      // record (when they really clocked in via the driver app). Both get shown,
      // clearly labeled, whenever we could cross-reference the two.
      const timeLines = [];
      if (r.shiftStr) timeLines.push(`<span><span class="eta-label">Shift</span> <span class="eta-time">${escHtml(r.shiftStr)}</span></span>`);
      if (r.dutyStr) timeLines.push(`<span><span class="eta-label">Duty</span> <span class="eta-time">${escHtml(r.dutyStr)}</span></span>`);

      let onTimeLine = '';
      if (r.lateness != null) {
        const lateMin = Math.round(r.lateness / 60);
        onTimeLine = lateMin > 1
          ? `<div class="addr" style="color:#ffb74d;font-size:.7rem;margin-top:.3rem">${svgIcon('clock')} ${lateMin} min late</div>`
          : `<div class="addr" style="color:#81c784;font-size:.7rem;margin-top:.3rem">${svgIcon('check')} On time</div>`;
      }

      const interruptions = [];
      if (r.hasDriverConflict) interruptions.push('Driver conflict');
      if (r.hasVehicleConflict) interruptions.push('Vehicle conflict');
      if (r.cancellationDetails) interruptions.push('Cancelled');
      if (r.onBreakSince) {
        const elapsedM = Math.max(0, Math.round((Date.now() / 1000 - r.onBreakSince) / 60));
        const capM = r.breakLenSec ? ` / ${Math.round(r.breakLenSec / 60)}m` : '';
        interruptions.push(`On break ${elapsedM}m${capM}`);
      }
      if (r.breakSec > 60) interruptions.push(`Break ${Math.round(r.breakSec / 60)}m`);
      if (r.pauseSec > 60) interruptions.push(`Paused ${Math.round(r.pauseSec / 60)}m`);
      const interruptLine = interruptions.length
        ? `<div class="access-icons">${interruptions.map(t => `<span class="access-tag" style="background:#3a1f1f;color:#ffab91">${svgIcon('warn')} ${escHtml(t)}</span>`).join('')}</div>`
        : '';

      return `<div class="duty-card ${r.status}${r.onBreakSince ? ' onBreak' : ''}" title="Click to show this van on the map" data-van-source="${r.source === 'spare' ? 'spare' : 'od'}" data-vehicle-id="${escHtml(r.vehicleId || '')}" data-driver="${escHtml(r.driverNameNorm || '')}">
        <div class="trip-header">
          <span class="rider-name">${escHtml(r.driverName)}</span>
          ${statusPill}
          <span style="margin-left:auto">${srcBadge}</span>
        </div>
        <div class="trip-body">
          <div class="addr">${assignLine}</div>
          <div class="trip-meta">${timeLines.join('')}</div>
          ${onTimeLine}
          ${interruptLine}
        </div>
      </div>`;
    }

    function renderDuties() {
      const list = document.getElementById('duties-list');

      const spareRows = spareDuties.map(d => {
        const driver = d.driver || {};
        const driverName = [driver.firstName, driver.lastName].filter(Boolean).join(' ') || '—';
        const vid = d.vehicleId || (d.vehicle && d.vehicle.id);
        const vehName = (d.vehicle && d.vehicle.identifier)
          || (vid && vehicleData[vid] && vehicleData[vid].identifier) || '—';
        const vObj = vid ? (vehicleData[vid] || {}) : {};
        const metrics = d.metrics || {};
        return {
          source: 'spare',
          startMs: (d.startRequestedTs || 0) * 1000,
          startTs: d.startRequestedTs || 0,
          endTs: d.endRequestedTs || 0,
          driverName,
          driverNameNorm: normalizeName(driverName),
          assignment: vehName,
          vanColor: vehName !== '—' ? getVanColor(vehName, vObj.markerColor || '#7c3aed') : null,
          status: d.status || 'unknown',
          vehicleId: vid || '',
          dutyStr: `${fmtTime(d.startRequestedTs)} – ${fmtTime(d.endRequestedTs)}`,
          shiftStr: null,
          detail: d.identifier || '',
          lateness: Number.isFinite(d.lateness) ? d.lateness : null,
          hasDriverConflict: !!d.hasDriverConflict,
          hasVehicleConflict: !!d.hasVehicleConflict,
          cancellationDetails: d.cancellationDetails || null,
          breakSec: Number.isFinite(metrics.totalBreakLengthS) ? metrics.totalBreakLengthS : 0,
          pauseSec: Number.isFinite(metrics.totalInProgressPauseLengthS) ? metrics.totalInProgressPauseLengthS : 0,
          // Live break/pause state (see _spare_active_break in app.py). Present only
          // while the driver is actually on a break -- the "paused on OnDemand" analogue.
          onBreakSince: (d.activeBreak && Number.isFinite(d.activeBreak.startedTs)) ? d.activeBreak.startedTs : null,
          breakLenSec: (d.activeBreak && Number.isFinite(d.activeBreak.breakLength)) ? d.activeBreak.breakLength : null,
        };
      });

      // Cross-reference each Spare duty against the W2W "FlexRide Driver" shift for the
      // same person covering the same stretch of time, if there is one -- everything else
      // in w2wShifts (OnDemand Driver/EB, or an unmatched FlexRide Driver shift) is listed
      // standalone below.
      const flexRideShifts = w2wShifts.filter(s => s.position_name === 'FlexRide Driver');
      const consumedShifts = new Set();
      for (const row of spareRows) {
        const match = flexRideShifts.find(s =>
          !consumedShifts.has(s) &&
          normalizeName(s.name) === row.driverNameNorm &&
          windowsOverlapWithSlack(row.startTs, row.endTs, (s.start_ts || 0) / 1000, (s.end_ts || 0) / 1000, 3600)
        );
        if (match) {
          consumedShifts.add(match);
          row.shiftStr = `${fmtTime(match.start_ts / 1000)} – ${fmtTime(match.end_ts / 1000)}`;
        }
      }

      const w2wRows = w2wShifts
        .filter(s => !consumedShifts.has(s))
        .map(s => {
          const nameNorm = normalizeName(s.name);
          // The OnDemand analogue of the Spare-duty cross-reference above: if this
          // driver has a live OnDemand van right now, attach it (van label + colour),
          // flip the row to "Active", and note how many rides it's carrying.
          const odVan = odVehicles.find(v => v.driverName && normalizeName(v.driverName) === nameNorm);
          return {
            source: 'w2w',
            startMs: s.start_ts || 0,
            driverName: s.name || '—',
            driverNameNorm: nameNorm,
            assignment: odVan ? odVan.label : (s.position_name || 'UVA Ride'),
            vanColor: odVan ? odVan.color : null,
            vehicleId: odVan ? odVan.vehicleId : '',
            odActive: !!odVan,
            status: odVan ? 'inProgress' : 'shift',
            shiftStr: `${fmtTime(s.start_ts / 1000)} – ${fmtTime(s.end_ts / 1000)}`,
            dutyStr: null,
            detail: odVan && odVan.rideCount ? `${odVan.rideCount} ride${odVan.rideCount > 1 ? 's' : ''}` : '',
            lateness: null, hasDriverConflict: false, hasVehicleConflict: false,
            cancellationDetails: null, breakSec: 0, pauseSec: 0,
          };
        });

      const rows = [...spareRows, ...w2wRows];
      document.getElementById('duty-count').textContent = rows.length;

      if (!rows.length) {
        list.innerHTML = '<div class="no-duties">No shifts or duties today</div>';
        return;
      }

      rows.sort((a, b) => a.startMs - b.startMs);
      list.innerHTML = rows.map(buildDutyCard).join('');
      if (selectedVan) applyVanHighlight(false);
    }

    // Remove Spare vehicle markers for vans not on an inProgress duty
    function syncVehicleMarkersWithDuties() {
      const activeVids = new Set(
        spareDuties
          .filter(d => d.status === 'inProgress')
          .map(d => d.vehicleId || d.vehicle?.id)
          .filter(Boolean)
      );
      for (const vid of Object.keys(vehicleMarkers)) {
        if (!activeVids.has(vid)) {
          map.removeLayer(vehicleMarkers[vid]); delete vehicleMarkers[vid];
          if (bubbleMarkers[vid]) { map.removeLayer(bubbleMarkers[vid]); delete bubbleMarkers[vid]; }
          if (speedMarkers[vid])  { map.removeLayer(speedMarkers[vid]);  delete speedMarkers[vid]; }
        }
      }
    }

    async function fetchDuties() {
      try {
        const res = await fetch('/api/spare/duties');
        if (!res.ok) return;
        const dutiesJson = await res.json();
        spareDuties = Array.isArray(dutiesJson) ? dutiesJson : [];
        spareDuties.forEach(d => { if (d.id) dutiesData[d.id] = d; });
        renderDuties();
        syncVehicleMarkersWithDuties();
      } catch (err) {
        console.error('duties fetch failed:', err);
      }
    }

    async function fetchW2WShifts() {
      try {
        const res = await fetch('/v1/dispatch/block-drivers');
        if (res.status === 403 || res.status === 401) return;
        if (!res.ok) return;
        const data = await res.json();
        const byBlock = data.assignments_by_block || {};
        const shifts = [];
        for (const blockName of ['OnDemand Driver', 'OnDemand EB', 'FlexRide Driver']) {
          const block = byBlock[blockName];
          if (!block) continue;
          for (const period of Object.values(block)) {
            for (const s of period) {
              shifts.push({ ...s, position_name: blockName });
            }
          }
        }
        w2wShifts = shifts;
        renderDuties();
      } catch (err) {
        console.error('[w2w] fetch failed:', err);
      }
    }

    // ---- Service area outline (Spare zones, unioned server-side) ----
    // A quiet reference layer under everything else: dashed outline + whisper-faint
    // fill of the merged paratransit coverage area. 204 (key can't read zones) -> skip.
    let serviceAreaLayer = null;
    let serviceAreaPolys = null;   // [[outerRing, hole...], ...] of [lng,lat] pairs -- for point-in-area tests
    async function loadServiceArea() {
      try {
        const res = await fetch('/api/spare/service-area');
        if (res.status === 204 || !res.ok) return;
        const gj = await res.json();
        if (serviceAreaLayer) { map.removeLayer(serviceAreaLayer); serviceAreaLayer = null; }
        serviceAreaLayer = L.geoJSON(gj, {
          interactive: false,
          style: { color: '#8b5cf6', weight: 1.5, opacity: 0.5, dashArray: '5 5',
                   fill: true, fillColor: '#8b5cf6', fillOpacity: 0.045 },
        }).addTo(map);
        serviceAreaLayer.bringToBack();
        const geom = gj && gj.geometry;
        if (geom && geom.type === 'Polygon') serviceAreaPolys = [geom.coordinates];
        else if (geom && geom.type === 'MultiPolygon') serviceAreaPolys = geom.coordinates;
      } catch (_) { /* leave the map alone */ }
    }

    // ---- PulsePoint emergency incidents (inside the service area only) ----
    // Mirrors testmap's incident layer -- respond-icon markers, a pulsating halo, and a
    // popup -- but only for incidents that fall within the merged service-area polygon.
    function _pointInRing(lng, lat, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
        if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
      }
      return inside;
    }
    function inServiceArea(lat, lng) {
      if (!serviceAreaPolys) return false;   // no area loaded -> show nothing (only-inside rule)
      for (const poly of serviceAreaPolys) {
        if (_pointInRing(lng, lat, poly[0]) && !poly.slice(1).some(h => _pointInRing(lng, lat, h))) return true;
      }
      return false;
    }

    function incidentHaloIcon() {
      if (!_haloIcon) {
        _haloIcon = L.divIcon({
          className: 'incident-halo-icon',
          iconSize: [HALO_DIAMETER, HALO_DIAMETER],
          iconAnchor: [HALO_DIAMETER / 2, HALO_DIAMETER / 2],
          // --animated baked in; the reduced-motion @media rule disables it where needed.

    function incidentIcon(url) {
      // The PulsePoint respond icons are square teardrop pins (183x183) -- keep 1:1 or
      // they squish; anchor near the pin tip.
      if (url) return L.icon({ iconUrl: url, iconSize: [40, 40], iconAnchor: [20, 38], className: 'incident-marker-icon' });
      return L.divIcon({ className: '', iconSize: [14, 14], iconAnchor: [7, 7],
        html: '<div style="width:14px;height:14px;border-radius:50%;background:#ef4444;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>' });
    }
    function _incidentType(rec) {
      const cands = [rec.PulsePointIncidentCallTypeCode, rec.PulsePointIncidentTypeCode,
        rec.CallTypeCode, rec.TypeCode, rec.PulsePointIncidentCallType, rec.CallType];
      for (const v of cands) {
        if (v == null) continue;
        const t = String(v).trim();
        if (/^[A-Za-z0-9]{1,6}$/.test(t)) return t.toUpperCase();
        const words = t.match(/[A-Za-z0-9]+/g);
        if (words && words.length >= 2) {
          const acr = words.map(w => w[0]).join('');
          if (/^[A-Za-z0-9]{1,4}$/.test(acr)) return acr.toUpperCase();
        }
      }
      return '';
    }
    function normIncidents(root) {
      // Active incidents only -- recent/cleared calls aren't actionable for dispatch.
      const arr = root && root.incidents && Array.isArray(root.incidents.active) ? root.incidents.active : [];
      const out = [];
      for (const rec of arr) {
        const lat = parseFloat(rec.Latitude ?? rec.latitude ?? rec.lat);
        const lng = parseFloat(rec.Longitude ?? rec.longitude ?? rec.lon);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
        const id = String(rec.ID ?? rec.PulsePointIncidentID ?? rec.PulsePointIncidentCallNumber ?? `${lat.toFixed(6)},${lng.toFixed(6)}`);
        const type = _incidentType(rec);
        out.push({
          id, lat, lng, type, raw: rec,
          iconUrl: type ? `${INCIDENT_ICON_BASE}${type.toLowerCase()}_map_active.png` : '',
        });
      }
      return out;
    }

    // ---- Incident popup content (ported from testmap) ----
    const INCIDENT_UNIT_STATUS_INFO = {
      DP:{label:'Dispatched',color:'#f57c00',background:'rgba(245,124,0,0.16)',border:'rgba(245,124,0,0.38)'},
      AK:{label:'Acknowledged',color:'#f57c00',background:'rgba(245,124,0,0.16)',border:'rgba(245,124,0,0.38)'},
      ER:{label:'En Route',color:'#00cc00',background:'rgba(0,204,0,0.16)',border:'rgba(0,204,0,0.38)'},
      SG:{label:'Staged',color:'#cc0000',background:'rgba(204,0,0,0.16)',border:'rgba(204,0,0,0.38)'},
      OS:{label:'On Scene',color:'#cc0000',background:'rgba(204,0,0,0.16)',border:'rgba(204,0,0,0.38)'},
      AE:{label:'Available On Scene',color:'#cc0000',background:'rgba(204,0,0,0.16)',border:'rgba(204,0,0,0.38)'},
      TR:{label:'Transport',color:'#ffc107',background:'rgba(255,193,7,0.16)',border:'rgba(255,193,7,0.38)'},
      TA:{label:'Transport Arrived',color:'#1976d2',background:'rgba(25,118,210,0.16)',border:'rgba(25,118,210,0.38)'},
      AR:{label:'Cleared From Incident',color:'#8a8a8a',background:'rgba(138,138,138,0.16)',border:'rgba(138,138,138,0.38)'},
    };
    const INCIDENT_UNIT_STATUS_ALIASES = {
      DP:'DP',DISPATCHED:'DP',DISPATCH:'DP', AK:'AK',ACK:'AK',ACKNOWLEDGED:'AK',
      ER:'ER','EN ROUTE':'ER',ENROUTE:'ER', SG:'SG',STAGED:'SG',
      OS:'OS','ON SCENE':'OS','ON-SCENE':'OS',ONSCENE:'OS',
      AE:'AE','AVAILABLE ON SCENE':'AE','AVAIL ON SCENE':'AE',
      TR:'TR',TRANSPORT:'TR',TRANSPORTING:'TR', TA:'TA','TRANSPORT ARRIVED':'TA',
      AR:'AR',CLEARED:'AR','CLEARED FROM INCIDENT':'AR',
    };
    const INCIDENT_UNIT_STATUS_ORDER = ['OS','AE','SG','ER','TR','TA','DP','AK','AR'];
    const INCIDENT_UNIT_FALLBACK_LABEL = 'Status Unknown';

    function _parseUnitString(text) {
      const t = typeof text === 'string' ? text.trim() : '';
      if (!t) return { name: '', status: '' };
      const m = t.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
      return m ? { name: m[1].trim(), status: m[2].trim() } : { name: t, status: '' };
    }
    function _normUnitStatus(value) {
      const raw = value == null ? '' : String(value).trim();
      if (!raw) return { key: '', raw: '', label: '', info: null };
      const canonical = INCIDENT_UNIT_STATUS_ALIASES[raw.toUpperCase()] || '';
      const info = canonical ? INCIDENT_UNIT_STATUS_INFO[canonical] || null : null;
      return { key: canonical, raw, info, label: (info && info.label) || raw };
    }
    function _extractIncidentUnits(rec) {
      const units = [];
      let updNotified = false;
      const src = Array.isArray(rec && rec.Unit) ? rec.Unit : [];
      for (const entry of src) {
        if (!entry) continue;
        let name = [entry.UnitID, entry.Unit, entry.Name].find(v => typeof v === 'string' && v.trim()) || '';
        let status = [entry.PulsePointDispatchStatus, entry.DispatchStatus, entry.Status].find(v => typeof v === 'string' && v.trim()) || '';
        name = name.trim();
        if (name.toUpperCase() === 'UVA2') { updNotified = true; continue; }  // UPD-notified, not an apparatus
        const n = _normUnitStatus(status);
        const displayText = name || n.label;
        if (!displayText) continue;
        units.push({ displayText, statusKey: n.key, statusLabel: n.label, colorInfo: n.info, tooltip: n.label });
      }
      if (updNotified) units.updNotified = true;
      return units;
    }
    function _renderIncidentUnit(u) {
      if (!u || !u.displayText) return '';
      const s = [];
      if (u.colorInfo) {
        if (u.colorInfo.color) s.push(`color:${u.colorInfo.color}`);
        if (u.colorInfo.background) s.push(`background:${u.colorInfo.background}`);
        if (u.colorInfo.border) s.push(`border-color:${u.colorInfo.border}`);
      }
      const styleAttr = s.length ? ` style="${s.join(';')}"` : '';
      const titleAttr = u.tooltip ? ` title="${escHtml(u.tooltip)}"` : '';
      return `<span class="incident-unit${u.statusKey ? ` incident-unit--${u.statusKey.toLowerCase()}` : ''}"${styleAttr}${titleAttr}>${escHtml(u.displayText)}</span>`;
    }
    function _renderIncidentUnitsSection(units) {
      const valid = (units || []).filter(u => u && u.displayText);
      const updBadge = units && units.updNotified
        ? `<div class="incident-popup__unit-list"><span class="incident-unit incident-unit--upd-notified">UPD Notified</span></div>` : '';
      if (!valid.length && !updBadge) return '';
      const groupsMap = new Map();
      valid.forEach((u, i) => {
        const label = u.statusLabel || u.statusKey || INCIDENT_UNIT_FALLBACK_LABEL;
        const mapKey = u.statusKey ? `k:${u.statusKey}` : `l:${label.toLowerCase()}`;
        let g = groupsMap.get(mapKey);
        if (!g) {
          const idx = u.statusKey ? INCIDENT_UNIT_STATUS_ORDER.indexOf(u.statusKey) : -1;
          g = { label, units: [], sortIndex: idx === -1 ? INCIDENT_UNIT_STATUS_ORDER.length : idx, first: i };
          groupsMap.set(mapKey, g);
        }
        g.units.push(u);
      });
      const groupsHtml = [...groupsMap.values()]
        .sort((a, b) => a.sortIndex - b.sortIndex || a.first - b.first || a.label.localeCompare(b.label))
        .map(g => {
          const list = g.units.map(_renderIncidentUnit).filter(Boolean).join('');
          return list ? `<div class="incident-popup__unit-status-group"><div class="incident-popup__unit-status-title">${escHtml(g.label)}</div><div class="incident-popup__unit-list">${list}</div></div>` : '';
        }).filter(Boolean).join('');
      if (!groupsHtml && !updBadge) return '';
      return `<div class="incident-popup__section incident-popup__units"><div class="incident-popup__section-title">Units</div>${groupsHtml}${updBadge}</div>`;
    }
    function _incidentReceivedTime(rec) {
      const d = Date.parse(rec.CallReceivedDateTime || rec.CallReceivedDateTimeLocal || '');
      if (!Number.isFinite(d)) return null;
      const dt = new Date(d);
      try {
        return {
          display: new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'America/New_York' }).format(dt),
          full: new Intl.DateTimeFormat('en-US', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'America/New_York' }).format(dt),
        };
      } catch (_) { const f = dt.toLocaleString(); return { display: f, full: f }; }
    }
    function incidentPopupHtml(inc) {
      const rec = inc.raw || {};
      const typeLabel = INCIDENT_TYPE_LABELS[inc.type] || rec.PulsePointIncidentCallType || rec.CallType || 'Incident';
      const listIcon = inc.type ? `${INCIDENT_ICON_BASE}${inc.type.toLowerCase()}_list.png` : '';
      const iconHtml = listIcon
        ? `<div class="incident-popup__icon"><img src="${escHtml(listIcon)}" alt="${escHtml(typeLabel)} icon" onerror="this.style.display='none'"></div>`
        : `<div class="incident-popup__icon"><span class="incident-popup__icon-fallback">${escHtml((typeLabel || 'I').charAt(0))}</span></div>`;
      const t = _incidentReceivedTime(rec);
      const receivedLine = t ? `<div class="incident-popup__meta-line" title="${escHtml(t.full)}">Received ${escHtml(t.display)}</div>` : '';
      const loc = rec.FullDisplayAddress || rec.DisplayAddress || rec.Address || rec.MedicalEmergencyDisplayAddress || rec.CrossStreet || '';
      const locLine = loc ? `<div class="incident-popup__meta-line">Location: ${escHtml(String(loc).trim())}</div>` : '';
      const metaLines = [receivedLine, locLine].filter(Boolean).join('');
      const metaHtml = metaLines ? `<div class="incident-popup__meta">${metaLines}</div>` : '';
      const unitsHtml = _renderIncidentUnitsSection(_extractIncidentUnits(rec));
      return `<div class="incident-popup">
        <div class="incident-popup__header">
          ${iconHtml}
          <div class="incident-popup__details">
            <div class="incident-popup__title">${escHtml(typeLabel)}</div>
            ${metaHtml}
          </div>
        </div>
        ${unitsHtml}
      </div>`;
    }

    const incidentMarkers = new Map();   // id -> { marker, halo }
    async function loadIncidents() {
      if (!serviceAreaPolys) return;      // need the area to filter against
      let root;
      try {
        const res = await fetch('/v1/pulsepoint/incidents');
        if (!res.ok) return;
        root = await res.json();
      } catch (_) { return; }
      const seen = new Set();
      for (const inc of normIncidents(root)) {
        if (seen.has(inc.id)) continue;          // guard against a duplicate id in the feed
        if (!inServiceArea(inc.lat, inc.lng)) continue;
        seen.add(inc.id);
        let entry = incidentMarkers.get(inc.id);
        if (!entry) {
          const halo = L.marker([inc.lat, inc.lng], { icon: incidentHaloIcon(), interactive: false, keyboard: false }).addTo(map);
          const marker = L.marker([inc.lat, inc.lng], { icon: incidentIcon(inc.iconUrl), zIndexOffset: 700 })
            .bindPopup(incidentPopupHtml(inc), { className: 'incident-leaflet-popup', maxWidth: 360 })
            .addTo(map);
          incidentMarkers.set(inc.id, { marker, halo });
        } else {
          entry.marker.setLatLng([inc.lat, inc.lng]).setIcon(incidentIcon(inc.iconUrl)).setPopupContent(incidentPopupHtml(inc));
          entry.halo.setLatLng([inc.lat, inc.lng]);
        }
      }
      for (const [id, entry] of incidentMarkers) {
        if (!seen.has(id)) { map.removeLayer(entry.marker); map.removeLayer(entry.halo); incidentMarkers.delete(id); }
      }
    }

    // ---- Initial load + polling ----
    loadVanColors().then(() => {
      loadVehicleIdents().then(() => { renderTrips(); renderStopOrderMarkers(); });
      fetchOnDemand();
    });
    fetchTrips();
    fetchDuties();
    fetchW2WShifts();
    loadServiceArea().then(loadIncidents);
    updateLastRefresh();

    setInterval(loadServiceArea, 3_600_000);
    setInterval(loadIncidents, 20_000);
    setInterval(() => { fetchTrips(); updateLastRefresh(); }, 30_000);
    setInterval(fetchDuties, 60_000);
    setInterval(fetchW2WShifts, 60_000);
    setInterval(loadVehicleIdents, 120_000);
    setInterval(loadVanColors, 60_000);
    setInterval(fetchOnDemand, 10_000);
  </script>
</body>
</html>
