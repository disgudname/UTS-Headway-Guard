<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/media/favicon.ico" />
  <link rel="apple-touch-icon" sizes="120x120" href="/media/apple-touch-icon-120.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/media/apple-touch-icon-152.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/media/apple-touch-icon-180.png" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#E57200">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Van Dispatch</title>
  <script defer src="/nav-bar.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0d0d;
      --text: #f0f0f0;
      --text-muted: #999;
      --text-faint: #666;
      --text-faintest: #555;
      --panel-bg: #111;
      --panel-header-bg: #16162a;
      --card-bg: #1a1a2e;
      --row-hover-bg: #1a1a2e;
      --border: #2a2a44;
      --border-soft: #1e1e32;
      --header-grad-a: #1a0a3d;
      --header-grad-b: #0f0820;
      --header-border: #6c3fc5;
      --header-title: #e0d0ff;
      --accent-label: #9980d0;
      --rider-name: #e0d0ff;
      --eta-time: #f0f0f0;
      --trip-body-text: #aaa;
      --td-text: #ddd;
      --card-hover-border: #6c3fc5;
      --card-selected-border: #8a5cd6;
      --card-selected-ring: rgba(138,92,214,0.35);
      --trip-note: #ffd54f;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f3f1f9;
      --text: #1e1b2e;
      --text-muted: #6b6478;
      --text-faint: #8f889c;
      --text-faintest: #a8a1b5;
      --panel-bg: #ffffff;
      --panel-header-bg: #f1ecfa;
      --card-bg: #fbfaff;
      --row-hover-bg: #f1ecfa;
      --border: #ded7ee;
      --border-soft: #e8e2f4;
      --header-grad-a: #efe6ff;
      --header-grad-b: #f9f6ff;
      --header-border: #8a5cd6;
      --header-title: #3d1a78;
      --accent-label: #7143c2;
      --rider-name: #3d1a78;
      --eta-time: #1e1b2e;
      --trip-body-text: #5b5468;
      --td-text: #33304a;
      --card-hover-border: #6c3fc5;
      --card-selected-border: #7143c2;
      --card-selected-ring: rgba(113,67,194,0.28);
      /* dark amber -- the dark-mode #ffd54f is unreadable on the near-white card bg */
      --trip-note: #9a6700;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @font-face {
      font-family: 'FGDC';
      src: url('/FGDC.ttf') format('truetype');
    }
    html, body { height: 100%; }
    body {
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(120deg, var(--header-grad-a), var(--header-grad-b));
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 2px solid var(--header-border);
    }
    header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--header-title);
      letter-spacing: 0.02em;
    }
    header .subtitle {
      font-size: 0.8rem;
      color: var(--accent-label);
      margin-left: auto;
    }
    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .theme-toggle:hover { border-color: var(--header-border); background: rgba(108,63,197,0.12); }
    #status-bar {
      background: var(--card-bg);
      padding: 0.4rem 1.5rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }
    #status-bar .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #555;
      display: inline-block;
    }
    .dot.live { background: #4caf50; box-shadow: 0 0 6px #4caf5099; }
    .dot.warn { background: #ff9800; }
    .dot.off  { background: #f44336; }

    .main-layout {
      display: grid;
      grid-template-columns: 360px 1fr 420px;
      grid-template-rows: 1fr;
      flex: 1;
      min-height: 0;
    }
    /* Map */
    #map-pane {
      grid-row: 1;
      grid-column: 2;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
      min-height: 400px;
      background: var(--panel-bg);
    }
    #map-no-webhooks {
      display: none;
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #ffd54f;
      font-size: 0.75rem;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      pointer-events: none;
      white-space: nowrap;
    }

    /* Trip board */
    #trip-board {
      grid-row: 1;
      grid-column: 3;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      overflow: hidden;
    }
    #trip-board h2 {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-label);
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel-header-bg);
    }
    #trip-board h2 span {
      float: right;
      font-size: 0.75rem;
      color: var(--text-faint);
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
    }
    #trips-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .trip-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.8rem;
      margin-bottom: 0.5rem;
      transition: border-color 0.2s;
    }
    .trip-card:hover { border-color: var(--card-hover-border); }
    .trip-card.arriving { border-left: 3px solid #ff9800; }
    .trip-card.inProgress { border-left: 3px solid #4caf50; }
    .trip-card.accepted { border-left: 3px solid #2196f3; }
    .trip-card.processing { border-left: 3px solid #9e9e9e; }
    /* Highlight applied when the matching van is selected on the map */
    .trip-card.card-selected,
    .duty-card.card-selected {
      border-color: var(--card-selected-border);
      box-shadow: 0 0 0 2px var(--card-selected-ring);
    }
    .trip-note { color: var(--trip-note); }
    .trip-phone a { color: var(--accent-label); text-decoration: none; }
    .trip-phone a:hover { text-decoration: underline; }
    .trip-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .status-pill {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .status-pill.processing { background: #333; color: #aaa; }
    .status-pill.accepted   { background: #1565c0; color: #90caf9; }
    .status-pill.arriving   { background: #e65100; color: #ffe0b2; }
    .status-pill.inProgress { background: #1b5e20; color: #a5d6a7; }
    .rider-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--rider-name);
      flex: 1;
    }
    .trip-body {
      font-size: 0.78rem;
      color: var(--trip-body-text);
      line-height: 1.5;
    }
    .trip-body .addr {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .trip-meta {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.35rem;
      font-size: 0.75rem;
    }
    .trip-meta .eta-label { color: var(--accent-label); font-weight: 500; }
    .trip-meta .eta-time  { color: var(--eta-time); }
    .access-icons {
      display: flex;
      gap: 0.3rem;
      margin-top: 0.35rem;
      flex-wrap: wrap;
    }
    .access-tag {
      background: #2a1f4a;
      color: #b0a0e0;
      font-size: 0.68rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
    }
    .no-trips {
      text-align: center;
      color: var(--text-faintest);
      padding: 2rem 1rem;
      font-size: 0.85rem;
    }

    /* Duty roster */
    #duty-roster {
      grid-row: 1;
      grid-column: 1;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    #duty-roster h2 {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-label);
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel-header-bg);
    }
    #duties-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .duty-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.8rem;
      margin-bottom: 0.5rem;
      transition: border-color 0.2s;
      cursor: pointer;
    }
    .duty-card:hover { border-color: var(--card-hover-border); }
    .duty-card.scheduled  { border-left: 3px solid #2196f3; }
    .duty-card.inProgress { border-left: 3px solid #4caf50; }
    .duty-card.completed  { border-left: 3px solid #9e9e9e; }
    .duty-card.cancelled  { border-left: 3px solid #f44336; }
    .duty-card.shift      { border-left: 3px solid #6ee7b7; }
    /* Driver currently on a break/pause -- overrides the inProgress green stripe */
    .duty-card.onBreak    { border-left: 3px solid #ffb74d; }
    .duty-status {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .duty-status.scheduled   { background: #1a237e; color: #90caf9; }
    .duty-status.inProgress  { background: #1b5e20; color: #a5d6a7; }
    .duty-status.completed   { background: #212121; color: #757575; }
    .duty-status.cancelled   { background: #b71c1c; color: #ef9a9a; }
    .duty-status.onBreak     { background: #4a3a1f; color: #ffcc80; }
    .no-duties {
      text-align: center;
      color: var(--text-faintest);
      padding: 1.5rem;
      font-size: 0.82rem;
    }

    @media (max-width: 900px) {
      .main-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 45vh 1fr 1fr;
      }
      #map-pane { grid-column: 1; grid-row: 1; }
      #duty-roster { grid-column: 1; grid-row: 2; border-right: none; border-top: 1px solid var(--border); }
      #trip-board { grid-column: 1; grid-row: 3; border-left: none; border-top: 1px solid var(--border); }
    }

    /* ondemand-driver-popup (matches testmap style) */
    .leaflet-popup.ondemand-driver-popup .leaflet-popup-content-wrapper {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(15,23,42,0.25);
      color: #0f172a;
      font-family: "Inter","Segoe UI",system-ui,sans-serif;
      padding: 10px 14px;
      border: 2px solid rgba(35,45,75,0.08);
    }
    .leaflet-popup.ondemand-driver-popup .leaflet-popup-content { margin: 0; }
    .leaflet-popup.ondemand-driver-popup .leaflet-popup-tip {
      background: #ffffff;
      border: 2px solid rgba(35,45,75,0.08);
      box-shadow: 0 4px 12px rgba(15,23,42,0.25);
    }
    .ondemand-driver-popup__content {
      display: flex; flex-direction: column; gap: 4px; min-width: 160px;
    }
    .ondemand-driver-popup__section { display: flex; flex-direction: column; gap: 4px; }
    .ondemand-driver-popup__label {
      font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
      color: rgba(15,23,42,0.75);
    }
    .ondemand-driver-popup__value { font-size: 15px; font-weight: 700; color: #1f2937; }
    .ondemand-driver-popup__sub { font-size: 12px; color: #6b7280; margin-top: 2px; }
    /* Source badges in duty table */
    .source-badge {
      font-size: 0.65rem; font-weight: 700; padding: 0.1rem 0.35rem;
      border-radius: 3px; letter-spacing: 0.06em; text-transform: uppercase; vertical-align: middle;
    }
    .source-badge--spare { background: #2a1f4a; color: #b0a0e0; }
    .source-badge--w2w   { background: #142a1e; color: #6ee7b7; }
    /* Strip Leaflet's default white-box styling from SVG label icons */
    .bus-label-icon {
      pointer-events: none !important;
      background: transparent !important;
      border: none !important;
    }
    /* Same as .bus-label-icon but clickable -- used by the numbered stop-order pins,
       which need a popup on click (unlike the purely decorative name/speed bubbles). */
    .stop-order-icon {
      background: transparent !important;
      border: none !important;
      cursor: pointer;
    }
    .ondemand-driver-popup__divider {
      height: 1px; width: 100%; background: rgba(35,45,75,0.12); margin: 6px 0;
    }
    /* Info-card section (matches testmap buildInfoCardSection) */
    .bus-popup__drivers-list { display: flex; flex-direction: column; gap: 10px; }
    .bus-popup__driver-row {
      display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border-radius: 8px;
      background: rgba(35,45,75,0.04); border: 1px solid rgba(35,45,75,0.08);
    }
    .bus-popup__info-card { border-left: 3px solid; }
    .bus-popup__info-line { line-height: 1.4; }
    .bus-popup__info-line--route { font-size: 14px; font-weight: 700; color: #1f2937; }
    .bus-popup__info-line--block { font-size: 12px; font-weight: 600; color: #4b5563; }
    .bus-popup__info-line--meta  { font-size: 12px; font-weight: 500; color: #6b7280; }
    /* Ride cards (matches testmap renderOnDemandStopList) */
    .ondemand-driver-popup__stops { display: flex; flex-direction: column; gap: 6px; }
    .ondemand-driver-popup__rides { display: flex; flex-direction: column; gap: 10px; }
    .ondemand-driver-popup__ride-card {
      background: rgba(35,45,75,0.06); border: 1px solid rgba(35,45,75,0.12);
      border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
    }
    .ondemand-driver-popup__ride-header { display: flex; justify-content: space-between; align-items: center; }
    .ondemand-driver-popup__ride-name { font-weight: 700; font-size: 15px; color: #1f2937; }
    .ondemand-driver-popup__ride-order {
      font-weight: 700; font-size: 12px; color: #6b7280;
      background: rgba(35,45,75,0.12); padding: 3px 8px; border-radius: 999px;
    }
    .ondemand-driver-popup__ride-locations { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .ondemand-driver-popup__ride-location { display: flex; align-items: flex-start; gap: 8px; }
    .ondemand-driver-popup__ride-location-icon {
      flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700;
    }
    .ondemand-driver-popup__ride-location-icon--pickup  { background: #4ade80; color: #052e16; }
    .ondemand-driver-popup__ride-location-icon--dropoff { background: #f87171; color: #450a0a; }
    .ondemand-driver-popup__ride-location-icon--onboard { background: #60a5fa; color: #1e3a5f; }
    .ondemand-driver-popup__ride-location-text { flex: 1; color: #374151; line-height: 1.4; }

    /* PulsePoint incident markers + pulsating halo (ported from testmap) */
    .incident-marker-icon { filter: drop-shadow(0 3px 8px rgba(15,23,42,0.45)) drop-shadow(0 0 5px rgba(255,255,255,0.6)); }
    .incident-halo-icon { pointer-events: none !important; }
    .incident-halo-icon .incident-halo {
      position: absolute; left: 50%; top: 50%;
      width: var(--incident-halo-diameter, 110px); height: var(--incident-halo-diameter, 110px);
      margin-left: calc(-0.5 * var(--incident-halo-diameter, 110px));
      margin-top:  calc(-0.5 * var(--incident-halo-diameter, 110px));
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239,68,68,0.45) 0%, rgba(239,68,68,0) 72%);
      opacity: 0.45; transform: scale(0.3); transform-origin: 50% 50%;
      pointer-events: none; will-change: transform, opacity;
    }
    .incident-halo--animated { animation: incident-halo-pulse 1600ms cubic-bezier(0.25,1,0.5,1) infinite; }
    @keyframes incident-halo-pulse {
      0%   { transform: scale(0.3); opacity: 0.45; }
      70%  { opacity: 0.45; }
      100% { transform: scale(1); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .incident-halo--animated { animation: none; transform: scale(1); opacity: 0.4; }
    }
    /* Incident click popup (ported from testmap, themed to the vandispatch map) */
    .leaflet-popup.incident-leaflet-popup .leaflet-popup-content-wrapper {
      background: var(--card-bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 12px 34px rgba(0,0,0,0.4);
    }
    .leaflet-popup.incident-leaflet-popup .leaflet-popup-content { margin: 12px 14px; }
    .leaflet-popup.incident-leaflet-popup .leaflet-popup-tip { background: var(--card-bg); border: 1px solid var(--border); }
    .leaflet-popup.incident-leaflet-popup a.leaflet-popup-close-button { color: var(--text-muted); }
    .incident-popup {
      min-width: 240px; max-width: 320px;
      display: flex; flex-direction: column; gap: 12px;
      color: var(--text); text-transform: none; letter-spacing: 0.2px; white-space: normal;
    }
    .incident-popup__header { display: flex; align-items: flex-start; gap: 12px; }
    .incident-popup__details { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .incident-popup__icon {
      width: 52px; height: 52px; border-radius: 14px; background: #fff;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(15,23,42,0.08), 0 6px 16px rgba(0,0,0,0.3); flex-shrink: 0;
    }
    .incident-popup__icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .incident-popup__icon-fallback { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: rgba(15,23,42,0.75); }
    .incident-popup__title { font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .incident-popup__meta { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--text-muted); }
    .incident-popup__meta-line { line-height: 1.35; }
    .incident-popup__section { display: flex; flex-direction: column; gap: 6px; }
    .incident-popup__section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; color: var(--text-muted); }
    .incident-popup__units { gap: 8px; }
    .incident-popup__unit-status-group { display: flex; flex-direction: column; gap: 6px; }
    .incident-popup__unit-status-group + .incident-popup__unit-status-group { padding-top: 6px; border-top: 1px solid var(--border); }
    .incident-popup__unit-status-title { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; font-weight: 700; color: var(--text-muted); }
    .incident-popup__unit-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .incident-popup .incident-unit {
      display: inline-flex; align-items: center; font-size: 11px; font-weight: 700;
      padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--row-hover-bg); color: var(--text); letter-spacing: .3px;
    }
    .incident-unit--upd-notified {
      background: rgba(59,130,246,0.15) !important; border-color: rgba(59,130,246,0.45) !important; color: #93c5fd !important;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Van Dispatch</h1>
    </div>
    <span class="subtitle">UVA Ride &amp; UVA FlexRide</span>
    <button id="theme-toggle" class="theme-toggle" type="button" title="Toggle light/dark mode" aria-label="Toggle light/dark mode"></button>
  </header>

  <div id="status-bar">
    <div class="badge"><span class="dot" id="sse-dot"></span><span id="sse-label">connecting…</span></div>
    <div class="badge">Trips today: <strong id="trip-count">—</strong></div>
    <div class="badge">Duties: <strong id="duty-count">—</strong></div>
    <div class="badge">UVA Ride: <strong id="od-count">—</strong></div>
    <div class="badge" id="webhook-badge" style="display:none">
      <span class="dot warn"></span><span>Live GPS inactive — configure Spare webhook</span>
    </div>
    <div class="badge" style="margin-left:auto">
      <span id="last-refresh">—</span>
    </div>
  </div>

  <div class="main-layout">
    <div id="duty-roster">
      <h2>Duty Roster — Today</h2>
      <div id="duties-list"><div class="no-duties">Loading…</div></div>
    </div>

    <div id="map-pane">
      <div id="map"></div>
      <div id="map-no-webhooks">Vehicle GPS requires Spare webhook configuration</div>
    </div>

    <div id="trip-board">
      <h2>Active Trips <span id="trips-updated"></span></h2>
      <div id="trips-list"><div class="no-trips">Loading…</div></div>
    </div>
  </div>

  <script>
    // ---- Map init ----
    const CARTO_KEY = 'cb1_274a_1_de65d091600f3f8a641f3856';
    const map = L.map('map', { center: [38.0336, -78.5080], zoom: 13 });
    const tileLayer = L.tileLayer(`https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=${CARTO_KEY}`, {
      attribution: '© OpenStreetMap © CARTO',
      subdomains: 'abcd', maxZoom: 19,
    }).addTo(map);

    // ---- Light/dark theme toggle ----
    const THEME_STORAGE_KEY = 'vandispatch-theme';
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const btn = document.getElementById('theme-toggle');
      if (btn) btn.innerHTML = svgIcon(theme === 'light' ? 'sun' : 'moon');
      const basemapStyle = theme === 'light' ? 'light_all' : 'dark_all';
      tileLayer.setUrl(`https://{s}.basemaps.cartocdn.com/${basemapStyle}/{z}/{x}/{y}{r}.png?key=${CARTO_KEY}`);
    }
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const next = current === 'light' ? 'dark' : 'light';
      try { localStorage.setItem(THEME_STORAGE_KEY, next); } catch (_) { /* private browsing, etc. */ }
      applyTheme(next);
    }
    (function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem(THEME_STORAGE_KEY); } catch (_) { /* soft-fail */ }
      applyTheme(saved === 'light' ? 'light' : 'dark');
    })();
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

    // ---- State ----
    const vehicleData    = {};  // vehicleId -> full vehicle object (Spare)
    const dutiesData     = {};  // dutyId    -> full duty object (Spare)
    const vehicleMarkers = {};  // vehicleId -> bus-body L.marker (Spare, keyed by Spare vehicleId)
    const bubbleMarkers  = {};  // vehicleId -> name bubble L.marker (above)
    const speedMarkers   = {};  // vehicleId -> speed bubble L.marker (below)
    // OnDemand markers are keyed "od_<vehicleId>" to avoid collision with Spare
    const odVehicleMarkers = {};
    const odBubbleMarkers  = {};
    const odSpeedMarkers   = {};

    // ---- Helpers ----
    function escHtml(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Small inline stroke SVGs -- the board used to lean on emoji for these labels.
    // Sized to 1em so they sit inline with their text; stroke inherits `color`
    // (default currentColor).
    function svgIcon(name, color) {
      const body = {
        van:      '<path d="M1 11.5V4.5h8.5l3.5 3.5v3.5"/><path d="M1 11.5h13.5"/><circle cx="4.3" cy="11.7" r="1.6"/><circle cx="11.2" cy="11.7" r="1.6"/>',
        phone:    '<path d="M3.5 2.2 6 2l1 3-1.4 1a8.5 8.5 0 0 0 3.4 3.4L10 9l3 1-.2 2.5c-.1.6-.6 1-1.2 1C6.4 13.2 2.8 9.6 2.3 4.4c-.1-.6.3-1.1.9-1.2z"/>',
        note:     '<path d="M3.5 1.5h6L12.5 4.5v10h-9z"/><path d="M9 1.5V5h3.5"/><path d="M5.5 8h5M5.5 10.5h5M5.5 13h3"/>',
        calendar: '<rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/>',
        target:   '<circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="2.3"/>',
        clock:    '<circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.6 1.8"/>',
        check:    '<path d="M3 8.5 6.2 12 13 4.5"/>',
        warn:     '<path d="M8 2 14.5 13.5h-13z"/><path d="M8 6.5v3.6M8 12v.05"/>',
        moon:     '<path d="M13.2 9.4A5.6 5.6 0 1 1 6.6 2.8a4.6 4.6 0 0 0 6.6 6.6z"/>',
        sun:      '<circle cx="8" cy="8" r="3"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1"/>',
      }[name] || '';
      return `<svg viewBox="0 0 16 16" width="1em" height="1em" fill="none" stroke="${color || 'currentColor'}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.15em;flex-shrink:0" aria-hidden="true">${body}</svg>`;
    }

    // Parse OnDemand callName — always "VAN XX:" or "CAR XX:", strip colon + suffix, title-case prefix
    function parseOdCallName(raw) {
      if (!raw) return raw;
      const name = raw.split(':')[0].trim();
      return name.replace(/^([A-Za-z]+)/, m => m.charAt(0).toUpperCase() + m.slice(1).toLowerCase());
    }

    // ---- Van color config (shared across Spare + OnDemand) ----
    let vanColors = {};  // { "Van 16": "#hex", ... }

    function getVanColor(displayName, fallback) {
      return (displayName && vanColors[displayName]) || fallback;
    }

    async function loadVanColors() {
      try {
        const res = await fetch('/api/van-colors');
        if (res.ok) vanColors = await res.json();
      } catch (_) { /* soft-fail */ }
    }

    function fmtTime(ts) {
      if (!ts) return '—';
      return new Date(ts * 1000).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    // Spare gives rider phone numbers back in whatever shape the rider typed --
    // "(434) 555-0182", "434.555.0182", "4345550182". Normalize the displayed form
    // to plain dashes; a leading US country code is kept as its own "1-" group, and
    // anything that isn't a recognizable 10/11-digit number is shown as-is.
    function formatPhone(raw) {
      const s = String(raw ?? '').trim();
      const digits = s.replace(/\D/g, '');
      if (digits.length === 10) return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`;
      if (digits.length === 11 && digits[0] === '1') return `1-${digits.slice(1, 4)}-${digits.slice(4, 7)}-${digits.slice(7)}`;
      return s;
    }

    // How far ahead of the ride a request was booked -- e.g. "45m", "2h 10m", "3d 4h".
    function formatLeadTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return null;
      const mins = Math.round(seconds / 60);
      if (mins < 60) return `${mins}m`;
      const hrs = Math.floor(mins / 60);
      const remMins = mins % 60;
      if (hrs < 24) return remMins ? `${hrs}h ${remMins}m` : `${hrs}h`;
      const days = Math.floor(hrs / 24);
      const remHrs = hrs % 24;
      return remHrs ? `${days}d ${remHrs}h` : `${days}d`;
    }

    // Spare's intentType is how the rider framed the request when booking: "leaveAt"
    // (depart at a requested time -- including "leave now", which is just a leaveAt
    // request whose requested pickup time is right on top of when it was booked) or
    // "arriveBy" (be at the destination by a requested time).
    function rideIntentLabel(req) {
      if (req.intentType === 'arriveBy') {
        const t = req.requestedDropoffTs || req.scheduledDropoffTs;
        return t ? `Arrive by ${fmtTime(t)}` : null;
      }
      if (req.intentType === 'leaveAt') {
        const pu = req.requestedPickupTs || req.scheduledPickupTs;
        if (!pu) return null;
        if (req.createdAt && (pu - req.createdAt) <= 300) return 'Leave ASAP';
        return `Leave at ${fmtTime(pu)}`;
      }
      return null;
    }

    // ==== Bus marker geometry/rendering — ported verbatim from testmap.js /
    // testmap-vehicles.js (constants, contrastBW, bubble SVG formulas, leader-offset
    // math) so vans on this page look and sit exactly like vehicles on /map. One
    // deliberate simplification: testmap scales all of this by a zoom-dependent
    // `scale` factor (bus markers get bigger as you zoom in); this page's map doesn't
    // need that, so every formula below runs with scale fixed at 1. ====
    const BUS_MARKER_VIEWBOX_WIDTH  = 52.99;
    const BUS_MARKER_VIEWBOX_HEIGHT = 86.99;
    const BUS_MARKER_PIVOT_X = BUS_MARKER_VIEWBOX_WIDTH / 2;
    const BUS_MARKER_PIVOT_Y = BUS_MARKER_VIEWBOX_HEIGHT / 2;
    const BUS_MARKER_ASPECT_RATIO = BUS_MARKER_VIEWBOX_HEIGHT / BUS_MARKER_VIEWBOX_WIDTH;
    const BUS_MARKER_BASE_WIDTH_PX = 26;
    const BUS_MARKER_BASE_HEIGHT_PX = BUS_MARKER_BASE_WIDTH_PX * BUS_MARKER_ASPECT_RATIO;
    const BUS_MARKER_DEFAULT_HEADING = 0;
    const BUS_MARKER_LABEL_FONT_FAMILY = "'FGDC', sans-serif";
    const BUS_MARKER_LABEL_MIN_FONT_PX = 10;
    const LABEL_BASE_STROKE_WIDTH = 2.5;
    const LABEL_TEXT_VERTICAL_ADJUSTMENT_RATIO = 0.06;
    // Leader-offset tuning (how far the name/speed bubble floats from the van icon):
    const LABEL_VERTICAL_CLEARANCE_PX = -7;
    const LABEL_VERTICAL_ALIGNMENT_BONUS_PX = 6;
    const LABEL_VERTICAL_ALIGNMENT_EXPONENT = 4;
    const LABEL_HORIZONTAL_ALIGNMENT_BONUS_PX = 1;
    const NAME_BUBBLE_BASE_FONT_PX = 14;
    const NAME_BUBBLE_HORIZONTAL_PADDING = 14;
    const NAME_BUBBLE_VERTICAL_PADDING = 3;
    const NAME_BUBBLE_MIN_WIDTH = 40;
    const NAME_BUBBLE_MIN_HEIGHT = 20;
    const NAME_BUBBLE_CORNER_RADIUS = 10;
    const NAME_BUBBLE_FRAME_INSET = 5;
    const SPEED_BUBBLE_BASE_FONT_PX = 12;
    const SPEED_BUBBLE_HORIZONTAL_PADDING = 12;
    const SPEED_BUBBLE_VERTICAL_PADDING = 4;
    const SPEED_BUBBLE_MIN_WIDTH = 60;
    const SPEED_BUBBLE_MIN_HEIGHT = 20;
    const SPEED_BUBBLE_CORNER_RADIUS = 10;

    // Exact paths from media/busmarker.svg (the same file /map fetches at runtime).
    const BUS_MARKER_HALO_PATH    = 'M26.49,0c1.56,0,3.11.52,4.38,1.55,3.68,2.93,22.12,18.71,22.12,39.94,0,17.84-13.46,28.5-26.49,28.5S0,59.33,0,41.49C0,20.26,18.44,4.48,22.14,1.54,23.4.52,24.94.01,26.49.01h0Z';
    const BUS_MARKER_ROUTE_PATH   = 'M26.5,67.49c-11.5,0-24-9.5-24-26C2.5,23.99,16.3,9.39,23.7,3.49c1.6-1.3,4-1.3,5.6,0,7.4,5.9,21.2,20.5,21.2,38,0,16.5-12.5,26-24,26Z';
    const BUS_MARKER_RING_PATH    = 'M26.5,27.99c8.55,0,15.5,6.95,15.5,15.5s-6.95,15.5-15.5,15.5-15.5-6.95-15.5-15.5,6.95-15.5,15.5-15.5ZM26.5,52.49c4.97,0,9-4.03,9-9s-4.03-9-9-9-9,4.03-9,9,4.03,9,9,9Z';
    const BUS_MARKER_HEADING_PATH = 'M26.5,8.49l10,18c-6.67-4-13.33-4-20,0l10-18Z';

    // Exact port of testmap-core.js's contrastBW(): YIQ perceived brightness,
    // threshold raised to 150 (not the usual 128) for better contrast on
    // medium-brightness colors like orange.
    function contrastColor(hex) {
      if (typeof hex !== 'string') return '#ffffff';
      const h = hex.replace('#', '');
      if (h.length !== 6 && h.length !== 3) return '#ffffff';
      let r, g, b;
      if (h.length === 3) {
        r = parseInt(h[0] + h[0], 16); g = parseInt(h[1] + h[1], 16); b = parseInt(h[2] + h[2], 16);
      } else {
        r = parseInt(h.slice(0, 2), 16); g = parseInt(h.slice(2, 4), 16); b = parseInt(h.slice(4, 6), 16);
      }
      const yiq = (r * 299 + g * 587 + b * 114) / 1000;
      return yiq >= 150 ? '#000000' : '#ffffff';
    }

    function round2(v) { return Math.round((Number(v) || 0) * 100) / 100; }

    const _bubbleCanvas = document.createElement('canvas');
    function measureLabelTextWidth(text, fontSizePx) {
      const ctx = _bubbleCanvas.getContext('2d');
      const size = Math.max(1, Number(fontSizePx) || 0);
      if (!ctx) return (text || '').length * size * 0.6;
      ctx.font = `bold ${size}px ${BUS_MARKER_LABEL_FONT_FAMILY}`;
      const m = ctx.measureText(text || '');
      return m && Number.isFinite(m.width) ? m.width : (text || '').length * size * 0.6;
    }

    // Real visible bounding box of the bus icon (the halo circle — the widest shape —
    // not the taller-than-it-needs-to-be SVG viewBox), measured the same way testmap
    // does (getBBox() on a live SVG), so labels sit the same distance from the van
    // regardless of which way it's facing.
    let _busMarkerExtents = null;
    function getBusMarkerVisibleExtents() {
      if (_busMarkerExtents) return _busMarkerExtents;
      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', `0 0 ${BUS_MARKER_VIEWBOX_WIDTH} ${BUS_MARKER_VIEWBOX_HEIGHT}`);
      Object.assign(svg.style, { position: 'absolute', visibility: 'hidden', pointerEvents: 'none', left: '-9999px', top: '-9999px' });
      [BUS_MARKER_HALO_PATH, BUS_MARKER_ROUTE_PATH, BUS_MARKER_RING_PATH, BUS_MARKER_HEADING_PATH].forEach(d => {
        const p = document.createElementNS(svgNS, 'path');
        p.setAttribute('d', d);
        svg.appendChild(p);
      });
      document.body.appendChild(svg);
      try {
        const bbox = svg.getBBox();
        _busMarkerExtents = {
          top: BUS_MARKER_PIVOT_Y - bbox.y,
          bottom: (bbox.y + bbox.height) - BUS_MARKER_PIVOT_Y,
          left: BUS_MARKER_PIVOT_X - bbox.x,
          right: (bbox.x + bbox.width) - BUS_MARKER_PIVOT_X,
        };
      } catch (_) {
        _busMarkerExtents = { top: BUS_MARKER_PIVOT_Y, bottom: BUS_MARKER_VIEWBOX_HEIGHT - BUS_MARKER_PIVOT_Y, left: BUS_MARKER_PIVOT_X, right: BUS_MARKER_VIEWBOX_WIDTH - BUS_MARKER_PIVOT_X };
      } finally {
        svg.remove();
      }
      return _busMarkerExtents;
    }

    function normalizeHeadingDegrees(deg) {
      let d = Number(deg);
      if (!Number.isFinite(d)) d = BUS_MARKER_DEFAULT_HEADING;
      d = d % 360;
      if (d < 0) d += 360;
      return d;
    }

    function computeBusMarkerVerticalExtentsForHeading(headingDeg) {
      const extents = getBusMarkerVisibleExtents();
      const normalizedHeading = normalizeHeadingDegrees(headingDeg);
      const rad = normalizedHeading * Math.PI / 180;
      const sin = Math.sin(rad), cos = Math.cos(rad);
      const corners = [
        { x: -extents.left,  y: -extents.top },
        { x:  extents.right, y: -extents.top },
        { x:  extents.right, y:  extents.bottom },
        { x: -extents.left,  y:  extents.bottom },
      ];
      let minY = Infinity, maxY = -Infinity;
      for (const c of corners) {
        const ry = c.x * sin + c.y * cos;
        if (ry < minY) minY = ry;
        if (ry > maxY) maxY = ry;
      }
      return { top: Math.abs(minY), bottom: Math.abs(maxY) };
    }

    // Exact port of testmap.js's computeLabelLeaderOffset() with scale fixed at 1.
    function computeLabelLeaderOffset(headingDeg, position) {
      const normalizedHeading = normalizeHeadingDegrees(headingDeg);
      const conversionFactor = BUS_MARKER_BASE_WIDTH_PX / BUS_MARKER_VIEWBOX_WIDTH;
      const headingRelativeToVertical = normalizedHeading % 180;
      const deviationFromVertical = Math.min(headingRelativeToVertical, 180 - headingRelativeToVertical);
      const verticality = Math.pow(Math.max(0, Math.cos(deviationFromVertical * Math.PI / 180)), LABEL_VERTICAL_ALIGNMENT_EXPONENT);
      const verticalAlignmentBonus = LABEL_VERTICAL_ALIGNMENT_BONUS_PX * verticality;
      const horizontalAlignmentBonus = LABEL_HORIZONTAL_ALIGNMENT_BONUS_PX * (1 - verticality);
      const verticalExtents = computeBusMarkerVerticalExtentsForHeading(normalizedHeading);
      const extentSvgUnits = position === 'below' ? verticalExtents.bottom : verticalExtents.top;
      const extentPx = extentSvgUnits * conversionFactor;
      const total = extentPx + LABEL_VERTICAL_CLEARANCE_PX + verticalAlignmentBonus + horizontalAlignmentBonus;
      return total > 0 ? total : 0;
    }

    // ---- Name bubble (matches testmap createNameBubbleDivIcon) ----
    function createBubbleIcon(text, fillColor, headingDeg) {
      if (typeof text !== 'string' || !text.trim()) return null;
      const name = text.trim();
      const fontSize = Math.max(BUS_MARKER_LABEL_MIN_FONT_PX, NAME_BUBBLE_BASE_FONT_PX);
      const textWidth = measureLabelTextWidth(name, fontSize);
      const rectWidth  = Math.max(NAME_BUBBLE_MIN_WIDTH, textWidth + NAME_BUBBLE_HORIZONTAL_PADDING * 2);
      const rectHeight = Math.max(NAME_BUBBLE_MIN_HEIGHT, fontSize + NAME_BUBBLE_VERTICAL_PADDING * 2);
      const strokeWidth = Math.max(1, LABEL_BASE_STROKE_WIDTH);
      const svgWidth  = round2(rectWidth + strokeWidth * 2);
      const svgHeight = round2(rectHeight + NAME_BUBBLE_FRAME_INSET * 2 + strokeWidth);
      const rectX = round2(strokeWidth);
      const rectY = round2(NAME_BUBBLE_FRAME_INSET + strokeWidth / 2);
      const textX = round2(svgWidth / 2);
      const textY = round2(rectY + rectHeight / 2 + fontSize * LABEL_TEXT_VERTICAL_ADJUSTMENT_RATIO);
      const anchorY = svgHeight + round2(computeLabelLeaderOffset(headingDeg, 'above'));
      const textColor = contrastColor(fillColor);
      const svg = `<svg width="${svgWidth}" height="${svgHeight}" viewBox="0 0 ${svgWidth} ${svgHeight}" xmlns="http://www.w3.org/2000/svg" style="pointer-events:none">
        <rect x="${rectX}" y="${rectY}" width="${round2(rectWidth)}" height="${round2(rectHeight)}" rx="${NAME_BUBBLE_CORNER_RADIUS}" ry="${NAME_BUBBLE_CORNER_RADIUS}" fill="${fillColor}" stroke="white" stroke-width="${round2(strokeWidth)}"/>
        <text x="${textX}" y="${textY}" text-anchor="middle" dominant-baseline="middle" font-size="${round2(fontSize)}" font-weight="bold" fill="${textColor}" font-family="${BUS_MARKER_LABEL_FONT_FAMILY}">${escHtml(name)}</text>
      </svg>`;
      return L.divIcon({ html: svg, className: 'leaflet-div-icon bus-label-icon', iconSize: [svgWidth, svgHeight], iconAnchor: [textX, anchorY] });
    }

    // ---- Speed bubble (below marker, matches testmap createSpeedBubbleDivIcon) ----
    function createSpeedBubbleIcon(speedMph, fillColor, headingDeg) {
      if (!Number.isFinite(speedMph)) return null;
      const fontSize = Math.max(BUS_MARKER_LABEL_MIN_FONT_PX, SPEED_BUBBLE_BASE_FONT_PX);
      const label = `${Math.max(0, Math.round(speedMph))} MPH`;
      const textWidth = measureLabelTextWidth(label, fontSize);
      const rectWidth  = Math.max(SPEED_BUBBLE_MIN_WIDTH, textWidth + SPEED_BUBBLE_HORIZONTAL_PADDING * 2);
      const rectHeight = Math.max(SPEED_BUBBLE_MIN_HEIGHT, fontSize + SPEED_BUBBLE_VERTICAL_PADDING * 2);
      const strokeWidth = Math.max(1, LABEL_BASE_STROKE_WIDTH);
      const svgWidth  = round2(rectWidth + strokeWidth * 2);
      const svgHeight = round2(rectHeight + strokeWidth * 2);
      const textX = round2(svgWidth / 2);
      const textY = round2(svgHeight / 2 + fontSize * LABEL_TEXT_VERTICAL_ADJUSTMENT_RATIO);
      const anchorY = -round2(computeLabelLeaderOffset(headingDeg, 'below'));
      const textColor = contrastColor(fillColor);
      const svg = `<svg width="${svgWidth}" height="${svgHeight}" viewBox="0 0 ${svgWidth} ${svgHeight}" xmlns="http://www.w3.org/2000/svg" style="pointer-events:none">
        <rect x="${round2(strokeWidth)}" y="${round2(strokeWidth)}" width="${round2(rectWidth)}" height="${round2(rectHeight)}" rx="${SPEED_BUBBLE_CORNER_RADIUS}" ry="${SPEED_BUBBLE_CORNER_RADIUS}" fill="${fillColor}" stroke="white" stroke-width="${round2(strokeWidth)}"/>
        <text x="${textX}" y="${textY}" text-anchor="middle" dominant-baseline="middle" font-size="${round2(fontSize)}" font-weight="bold" fill="${textColor}" font-family="${BUS_MARKER_LABEL_FONT_FAMILY}">${escHtml(label)}</text>
      </svg>`;
      return L.divIcon({ html: svg, className: 'leaflet-div-icon bus-label-icon', iconSize: [svgWidth, svgHeight], iconAnchor: [textX, anchorY] });
    }

    // ---- Bus-body marker icon (matches testmap's busmarker.svg + applyColorsToBusMarkerSvg:
    // route_color gets the van's color, halo stays white, center_ring + heading arrow get
    // whichever of black/white contrasts with the van's color) ----
    // stopped=true swaps the centre ring for a filled square, like testmap does for a
    // vehicle sitting still (speed <= 1 mph).
    function makeBusMarkerIcon(bearing, fillColor = '#7c3aed', stopped = false) {
      const glyphColor = contrastColor(fillColor);
      const width = BUS_MARKER_BASE_WIDTH_PX;
      const height = round2(BUS_MARKER_BASE_HEIGHT_PX);
      const centre = stopped
        ? `<rect x="15.5" y="32.49" width="22" height="22" rx="2.5" fill="${glyphColor}"/>`
        : `<path d="${BUS_MARKER_RING_PATH}" fill="${glyphColor}"/>`;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${BUS_MARKER_VIEWBOX_WIDTH} ${BUS_MARKER_VIEWBOX_HEIGHT}" width="${width}" height="${height}"
          style="transform:rotate(${bearing}deg);transform-origin:50% 50%;display:block;transition:transform 0.3s ease">
        <path d="${BUS_MARKER_HALO_PATH}" fill="#fff"/>
        <path d="${BUS_MARKER_ROUTE_PATH}" fill="${fillColor}"/>
        ${centre}
        <path d="${BUS_MARKER_HEADING_PATH}" fill="${glyphColor}"/>
      </svg>`;
      // Anchor at the icon's true center (matches testmap: BUS_MARKER_ICON_ANCHOR_X/Y_RATIO
      // are both 0.5 — the geographic point is the middle of the icon, not its bottom tip).
      return L.divIcon({ html: svg, className: '', iconSize: [width, height], iconAnchor: [width / 2, height / 2] });
    }

    // ---- Pickup/dropoff stop-order markers (numbered, colored to match the assigned van) ----
    // Spare's /requests doesn't carry an explicit sequence number for a van's stops (checked
    // the full field list), so order is inferred by sorting each van's active pickups/dropoffs
    // by scheduled time -- the same order Spare's own routing has to respect physically.
    const stopOrderMarkers = {};

    function createStopOrderMarker(number, color) {
      const SIZE = 30, STROKE = 3;
      const sw = round2(SIZE + STROKE * 2);
      const textColor = contrastColor(color);
      // No pointer-events:none here (unlike the name/speed bubble SVGs) -- this marker
      // needs to actually receive the click that opens its popup.
      const svg = `<svg width="${sw}" height="${sw}" viewBox="0 0 ${sw} ${sw}" xmlns="http://www.w3.org/2000/svg">
        <circle cx="${sw / 2}" cy="${sw / 2}" r="${SIZE / 2}" fill="${color}" stroke="white" stroke-width="${STROKE}"/>
        <text x="${sw / 2}" y="${sw / 2}" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="${textColor}" font-family="${BUS_MARKER_LABEL_FONT_FAMILY}">${number}</text>
      </svg>`;
      return L.divIcon({ html: svg, className: 'leaflet-div-icon stop-order-icon', iconSize: [sw, sw], iconAnchor: [sw / 2, sw / 2] });
    }

    function pointFromGeoJson(loc) {
      if (!loc || !Array.isArray(loc.coordinates)) return null;
      const [lng, lat] = loc.coordinates;
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
      return [lat, lng];
    }

    function clearStopOrderMarkers() {
      for (const key in stopOrderMarkers) { map.removeLayer(stopOrderMarkers[key]); delete stopOrderMarkers[key]; }
    }

    // A dropoff for one ride and a pickup for a different ride can legitimately land on the
    // exact same spot at essentially the same time (a shared stop/transfer point, or just two
    // riders using the same address back-to-back) -- rounding coordinates and allowing a short
    // time window catches that instead of drawing two markers stacked invisibly on top of each
    // other with two different, confusing order numbers.
    const STOP_COORD_PRECISION = 5;   // ~1.1m -- treat this as "the same physical spot"
    const STOP_SAME_VISIT_WINDOW_S = 180; // 3 min -- treat this as "the same visit"

    function buildStopPopupHtml(order, stops, vanLabel, vanColor) {
      const rows = stops.map(s => {
        const isPickup = s.kind === 'Pickup';
        const iconCls = isPickup ? 'ondemand-driver-popup__ride-location-icon--pickup' : 'ondemand-driver-popup__ride-location-icon--dropoff';
        return `<div class="ondemand-driver-popup__ride-location">
          <span class="ondemand-driver-popup__ride-location-icon ${iconCls}">${isPickup ? 'P' : 'D'}</span>
          <span class="ondemand-driver-popup__ride-location-text"><strong>${escHtml(s.name)}</strong> — ${s.kind} at ${fmtTime(s.ts)}<br>${escHtml(s.address || '—')}</span>
        </div>`;
      }).join('');
      const shared = stops.length > 1
        ? `<div class="ondemand-driver-popup__label" style="margin-top:8px;color:#b45309">${svgIcon('warn')} Shared stop — ${stops.length} events happen here</div>`
        : '';
      return `<div class="ondemand-driver-popup__content">
        <div class="ondemand-driver-popup__section">
          <div class="ondemand-driver-popup__label">Stop #${order} — <span style="color:${vanColor}">${escHtml(vanLabel)}</span></div>
        </div>
        <div class="ondemand-driver-popup__divider"></div>
        <div class="ondemand-driver-popup__ride-locations">${rows}</div>
        ${shared}
      </div>`;
    }

    const STOP_POPUP_OPTS = { className: 'ondemand-driver-popup', closeButton: true, autoClose: true, autoPan: true, offset: [0, -14] };

    // Group every active Spare trip's remaining pickup/dropoff into per-van, time-ordered
    // stop sequences, merging stops that land on the same spot around the same time (see
    // STOP_COORD_PRECISION/STOP_SAME_VISIT_WINDOW_S above). Shared by the numbered map pins
    // and by the "full route" preview, so both agree on what a van's stop order actually is.
    function computeVehicleStopGroups() {
      const byVehicle = {};
      for (const t of spareTrips) {
        if (!t.vehicleId) continue; // not yet assigned to a van -- no color/order to show
        const list = byVehicle[t.vehicleId] || (byVehicle[t.vehicleId] = []);
        const name = riderName(t);
        // Once a rider is picked up (inProgress), only the dropoff is still ahead of the van.
        if (t.status !== 'inProgress') {
          const p = pointFromGeoJson(t.scheduledPickupLocation || t.requestedPickupLocation);
          if (p) list.push({ ts: t.scheduledPickupTs || t.requestedPickupTs || 0, latlng: p, requestId: t.id, kind: 'Pickup', name, address: t.scheduledPickupAddress || t.requestedPickupAddress || '' });
        }
        const d = pointFromGeoJson(t.scheduledDropoffLocation || t.requestedDropoffLocation);
        if (d) list.push({ ts: t.scheduledDropoffTs || 0, latlng: d, requestId: t.id, kind: 'Dropoff', name, address: t.scheduledDropoffAddress || t.requestedDropoffAddress || '' });
      }
      const result = {};
      for (const vehicleId of Object.keys(byVehicle)) {
        const stops = byVehicle[vehicleId].slice().sort((a, b) => a.ts - b.ts);
        const groups = [];
        for (const stop of stops) {
          const key = stop.latlng.map(n => n.toFixed(STOP_COORD_PRECISION)).join(',');
          const existing = groups.find(g => g.key === key && Math.abs(g.ts - stop.ts) <= STOP_SAME_VISIT_WINDOW_S);
          if (existing) {
            existing.stops.push(stop);
            existing.ts = Math.min(existing.ts, stop.ts);
          } else {
            groups.push({ key, ts: stop.ts, latlng: stop.latlng, stops: [stop] });
          }
        }
        groups.sort((a, b) => a.ts - b.ts);
        result[vehicleId] = groups;
      }
      return result;
    }

    // Flattened `${requestId}-${kind}` -> order number, the same numbering shown on the
    // map's stop pins -- so a trip card can show "this is stop #3" right next to the
    // address, without a dispatcher having to cross-reference the map to find it.
    function computeStopOrderLookup() {
      const lookup = {};
      const byVehicle = computeVehicleStopGroups();
      for (const vehicleId of Object.keys(byVehicle)) {
        byVehicle[vehicleId].forEach((group, idx) => {
          const order = idx + 1;
          group.stops.forEach(stop => { lookup[`${stop.requestId}-${stop.kind}`] = order; });
        });
      }
      return lookup;
    }

    function stopOrderBadgeHtml(order, color) {
      if (!order) return '';
      const textColor = contrastColor(color);
      return `<span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:${color};color:${textColor};font-size:10px;font-weight:700;border:1.5px solid white;flex-shrink:0;margin-right:4px;vertical-align:middle">${order}</span>`;
    }

    function renderStopOrderMarkers() {
      clearStopOrderMarkers();
      const byVehicle = computeVehicleStopGroups();
      for (const vehicleId of Object.keys(byVehicle)) {
        const v = vehicleData[vehicleId] || {};
        const label = v.identifier || 'Van';
        const color = getVanColor(label, v.markerColor || '#7c3aed');
        byVehicle[vehicleId].forEach((group, idx) => {
          const order = idx + 1;
          const marker = L.marker(group.latlng, { icon: createStopOrderMarker(order, color), zIndexOffset: 400 })
            .bindPopup(buildStopPopupHtml(order, group.stops, label, color), STOP_POPUP_OPTS)
            .addTo(map);
          const key = group.stops.map(s => `${s.requestId}-${s.kind}`).join('|');
          stopOrderMarkers[key] = marker;
        });
      }
      renderOdStopOrderMarkers();
    }

    // OnDemand equivalent of the Spare stop pins above. The schedule feed already hands
    // us a per-van stop sequence (entry.order) and coordinates, so unlike Spare there's
    // nothing to infer -- just drop a numbered pin per stop, coloured to its van, into
    // the same stopOrderMarkers pool (cleared together with the Spare pins).
    function buildOdStopPopupHtml(s, color) {
      const isPickup = s.stopType === 'pickup';
      const riders = (s.riders || []).join(', ') || 'Rider';
      return `<div class="ondemand-driver-popup__content">
        <div class="ondemand-driver-popup__section">
          <div class="ondemand-driver-popup__label">Stop #${s.order} — <span style="color:${color}">${escHtml(s.vehicleName || 'Van')}</span></div>
        </div>
        <div class="ondemand-driver-popup__divider"></div>
        <div class="ondemand-driver-popup__ride-locations">
          <div class="ondemand-driver-popup__ride-location">
            <span class="ondemand-driver-popup__ride-location-icon ondemand-driver-popup__ride-location-icon--${isPickup ? 'pickup' : 'dropoff'}">${isPickup ? 'P' : 'D'}</span>
            <span class="ondemand-driver-popup__ride-location-text"><strong>${escHtml(riders)}</strong> — ${isPickup ? 'Pickup' : 'Drop-off'}${Number.isFinite(s.stopTs) ? ` at ${fmtTime(s.stopTs)}` : ''}<br>${escHtml(s.address || '—')}</span>
          </div>
        </div>
      </div>`;
    }

    function renderOdStopOrderMarkers() {
      const byVeh = {};
      for (const s of odStops) {
        if (s.lat == null || s.lng == null) continue;
        const rec = (s.rides && s.rides[0]) || {};
        const rs = s.rideStatus || rec.rideStatus || '';
        if (!OD_ACTIVE.has(rs) && rs !== '') continue;
        (byVeh[s.vehicleId] || (byVeh[s.vehicleId] = [])).push(s);
      }
      for (const vid of Object.keys(byVeh)) {
        const entries = byVeh[vid].slice().sort((a, b) => (a.order || 0) - (b.order || 0));
        const color = entries[0].vehicleColor || '#ec4899';
        entries.forEach(s => {
          if (!Number.isFinite(s.order)) return;
          const marker = L.marker([s.lat, s.lng], { icon: createStopOrderMarker(s.order, color), zIndexOffset: 400 })
            .bindPopup(buildOdStopPopupHtml(s, color), STOP_POPUP_OPTS)
            .addTo(map);
          stopOrderMarkers[`od-${vid}-${s.order}-${s.stopType}`] = marker;
        });
      }
    }

    // ---- Click-to-reveal driver route for one trip (GET /requests/{id}/currentRoute) ----
    // Fetched on demand, not polled: Spare's own docs note the route can change any time
    // Spare Engine re-optimizes, so it's only meaningful as a one-glance snapshot.
    let activeRouteLayers = [];

    // Shared weight for every route polyline drawn on this map (single-ride and
    // full-van-route alike), so they read as one consistent style.
    const ROUTE_LINE_WEIGHT = 5;

    // Bumped on every showVanFullRoute call. Because the selected van's route is
    // re-fetched on each position update (mirroring Spare's admin panel), an older
    // in-flight fetch can resolve after a newer one -- a stale draw. Each call
    // captures this value and bails before drawing if a newer call has superseded it.
    let routeDrawSeq = 0;

    function clearRequestRoute() {
      activeRouteLayers.forEach(l => map.removeLayer(l));
      activeRouteLayers = [];
    }

    // Standard Google Encoded Polyline Algorithm Format decoder (same implementation
    // already used by scripts/stop-approach.js elsewhere in this codebase).
    function decodeGooglePolyline(encoded) {
      const points = [];
      let index = 0, lat = 0, lng = 0;
      while (index < encoded.length) {
        let b, shift = 0, result = 0;
        do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        points.push([lat / 1e5, lng / 1e5]);
      }
      return points;
    }

    async function showRequestRoute(requestId) {
      clearRequestRoute();
      const req = spareTrips.find(t => t.id === requestId);
      const v = req && req.vehicleId ? (vehicleData[req.vehicleId] || {}) : {};
      const label = v.identifier || 'Van';
      const color = getVanColor(label, v.markerColor || '#7c3aed');

      let data;
      try {
        const res = await fetch(`/api/spare/requests/${encodeURIComponent(requestId)}/route`);
        if (!res.ok) return;
        data = await res.json();
      } catch (_) { return; }

      const bounds = [];
      const polylines = data.polylines || {};
      [['routeToPickup', '2 8'], ['routeToDropoff', null]].forEach(([key, dashArray]) => {
        const encoded = polylines[key];
        if (!encoded) return;
        const pts = decodeGooglePolyline(encoded);
        if (!pts.length) return;
        const line = L.polyline(pts, { color, weight: ROUTE_LINE_WEIGHT, opacity: 0.85, dashArray }).addTo(map);
        activeRouteLayers.push(line);
        bounds.push(...pts);
      });
      (data.stopovers || []).forEach(s => {
        const p = pointFromGeoJson(s.location);
        if (!p) return;
        const m = L.circleMarker(p, { radius: 5, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1 }).addTo(map);
        activeRouteLayers.push(m);
        bounds.push(p);
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [60, 60], maxZoom: 16 });
    }
    // Clicking empty map clears both the drawn route and any van selection. Van marker
    // clicks call L.DomEvent.stopPropagation, so this only fires for genuine map clicks.
    map.on('click', () => clearVanSelection());

    // ---- Full van route preview (current position through every remaining stop) ----
    // Spare's own currentRoute only works within ~20 minutes of a request's pickup (its
    // API returns 400 "Cannot get a driver route for a request whose pickup is more than
    // 20 minutes in the future" for anything further out) -- confirmed against a real van
    // with two active rides, where the second, further-out ride's route came back empty
    // for exactly this reason. Spare's own admin panel can still show a full multi-stop
    // path because it isn't limited to that live-navigation concept; we replicate it by
    // road-routing (via OpenRouteService, already used for OnDemand's route preview) leg
    // by leg through the van's own already-computed stop order, current position first.
    async function fetchRouteLeg(startLatLng, endLatLng) {
      try {
        const res = await fetch('/api/routes/leg', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ start: startLatLng, end: endLatLng }),
        });
        if (!res.ok) return null;
        const data = await res.json();
        return Array.isArray(data.coordinates) ? data.coordinates : null;
      } catch (_) {
        return null;
      }
    }

    // Preferred path: Spare's own undocumented GET /duties/{id}/polyline (found by watching
    // network traffic in Spare's admin panel -- it's what draws the full route there, and
    // our own SPARE_API_KEY can call it too, same auth as everything else). This is Spare's
    // actual computed route for the whole remaining duty, not our own approximation, so
    // prefer it whenever a dutyId is known. Falls back to routing our own stop-to-stop
    // legs via ORS (below) if it's missing, fails, or Spare ever changes/removes it.
    async function fetchDutyPolyline(dutyId) {
      try {
        const res = await fetch(`/api/spare/duties/${encodeURIComponent(dutyId)}/route`);
        if (!res.ok) return null;
        const data = await res.json();
        const coords = data && data.polyline && data.polyline.coordinates;
        if (!Array.isArray(coords) || !coords.length) return null;
        // Spare returns [lng, lat] pairs; Leaflet wants [lat, lng].
        return coords.map(([lng, lat]) => [lat, lng]);
      } catch (_) {
        return null;
      }
    }

    // Road-route from a van's current position through an ordered list of stop [lat,lng]s,
    // one ORS leg at a time (/api/routes/leg). Shared by the Spare leg-routing fallback and
    // by the OnDemand route preview -- OnDemand has no server-side route polyline like
    // Spare's duty polyline, so this is how its route gets drawn.
    async function drawLeggedRoute(startLatLng, stopLatLngs, color, fit, seq) {
      if (!stopLatLngs.length) { clearRequestRoute(); return; }
      const waypoints = [startLatLng, ...stopLatLngs];
      const legs = [];
      const bounds = [waypoints[0]];
      for (let i = 0; i < waypoints.length - 1; i++) {
        const leg = await fetchRouteLeg(waypoints[i], waypoints[i + 1]);
        if (seq !== routeDrawSeq) return; // superseded by a newer refresh
        if (!leg || !leg.length) continue;
        legs.push(leg);
        bounds.push(...leg);
      }
      // Swap in the freshly-routed legs only now they're all in hand, so a refresh
      // doesn't blank the map leg-by-leg while it re-routes.
      clearRequestRoute();
      legs.forEach(leg => activeRouteLayers.push(
        L.polyline(leg, { color, weight: ROUTE_LINE_WEIGHT, opacity: 0.85 }).addTo(map)
      ));
      if (fit && bounds.length > 1) map.fitBounds(bounds, { padding: [60, 60], maxZoom: 16 });
    }

    async function showVanFullRouteViaLegRouting(vehicleId, marker, color, fit, seq) {
      const groups = (computeVehicleStopGroups()[vehicleId] || []);
      const start = marker.getLatLng();
      await drawLeggedRoute([start.lat, start.lng], groups.map(g => g.latlng), color, fit, seq);
    }

    // OnDemand equivalent of showVanFullRoute -- routes the van's current position through
    // its ordered remaining stops (odStops carry lat/lng + order from the backend).
    async function showOdVanRoute(vehicleId, opts) {
      const fit = !(opts && opts.fit === false);
      const seq = ++routeDrawSeq;
      const marker = odVehicleMarkers['od_' + vehicleId];
      if (!marker) { clearRequestRoute(); return; }
      const stops = odStops
        .filter(s => String(s.vehicleId) === String(vehicleId) && Number.isFinite(s.lat) && Number.isFinite(s.lng))
        .slice()
        .sort((a, b) => (a.order || 0) - (b.order || 0));
      const color = (stops[0] && stops[0].vehicleColor) || '#ec4899';
      const start = marker.getLatLng();
      await drawLeggedRoute([start.lat, start.lng], stops.map(s => [s.lat, s.lng]), color, fit, seq);
    }

    // opts.fit (default true): fit the map to the route. The per-position-update
    // refresh passes fit:false so the map doesn't lurch every time the van moves.
    async function showVanFullRoute(vehicleId, opts) {
      const fit = !(opts && opts.fit === false);
      const seq = ++routeDrawSeq;
      const marker = vehicleMarkers[vehicleId];
      if (!marker) { clearRequestRoute(); return; }
      const v = vehicleData[vehicleId] || {};
      const label = v.identifier || 'Van';
      const color = getVanColor(label, v.markerColor || '#7c3aed');

      const dutyId = v.currentLocation && v.currentLocation.dutyId;
      const dutyPoints = dutyId ? await fetchDutyPolyline(dutyId) : null;
      if (seq !== routeDrawSeq) return; // a newer call superseded this one
      if (dutyPoints) {
        // Clear only now the replacement is ready -- keeps the old line up (no
        // flicker) across a refresh, and keeps the last good route if a poll blips.
        clearRequestRoute();
        activeRouteLayers.push(
          L.polyline(dutyPoints, { color, weight: ROUTE_LINE_WEIGHT, opacity: 0.85 }).addTo(map)
        );
        if (fit) map.fitBounds(dutyPoints, { padding: [60, 60], maxZoom: 16 });
        return;
      }

      await showVanFullRouteViaLegRouting(vehicleId, marker, color, fit, seq);
    }

    // ---- Van selection (replaces the old marker popups) ----
    // Clicking a van on the map highlights its card in the Duty Roster and every ride
    // card it's serving in Active Trips, and (Spare only) draws its full remaining route.
    // Clicking the same van again, another van, or empty map clears it. Held as plain
    // state + data-* lookups so it survives the roster/trip lists re-rendering on poll.
    let selectedVan = null; // { source: 'spare'|'od', id: string|null, driverNorm: string|null }

    function vanCardMatches(el) {
      if (!selectedVan) return false;
      if (el.dataset.vanSource !== selectedVan.source) return false;
      if (selectedVan.id && el.dataset.vehicleId && el.dataset.vehicleId === selectedVan.id) return true;
      // W2W shift rows / OnDemand cards carry no vehicle id -- fall back to driver name.
      if (selectedVan.driverNorm && el.dataset.driver && el.dataset.driver === selectedVan.driverNorm) return true;
      return false;
    }

    function applyVanHighlight(doScroll) {
      ['#duties-list', '#trips-list'].forEach(sel => {
        let firstHit = null;
        document.querySelectorAll(`${sel} .duty-card, ${sel} .trip-card`).forEach(el => {
          const hit = vanCardMatches(el);
          el.classList.toggle('card-selected', hit);
          if (hit && !firstHit) firstHit = el;
        });
        if (doScroll && firstHit) firstHit.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      });
    }

    function clearVanSelection() {
      selectedVan = null;
      document.querySelectorAll('.card-selected').forEach(el => el.classList.remove('card-selected'));
      clearRequestRoute();
    }

    function selectVan(source, vehicleId, driverNorm) {
      const id = vehicleId != null && vehicleId !== '' ? String(vehicleId) : null;
      const norm = driverNorm || null;
      if (selectedVan && selectedVan.source === source && selectedVan.id === id && selectedVan.driverNorm === norm) {
        clearVanSelection(); // clicked the already-selected van -- toggle off
        return;
      }
      selectedVan = { source, id, driverNorm: norm };
      applyVanHighlight(true);
      clearRequestRoute();
      if (source === 'spare' && id) showVanFullRoute(id);
      else if (source === 'od' && id) showOdVanRoute(id);
    }

    // Clicking a Duty Roster card does the same thing as clicking that van's map
    // marker -- highlight + (Spare) route preview. Delegated off the list container
    // so it keeps working after the roster re-renders, and reads the card's data-*
    // (rather than inlining a value into onclick) so a name with an apostrophe etc.
    // can't break it. Passes the same args the marker handlers do for each source.
    document.getElementById('duties-list').addEventListener('click', (e) => {
      const card = e.target.closest('.duty-card');
      if (!card) return;
      if (card.dataset.vanSource === 'spare') {
        selectVan('spare', card.dataset.vehicleId || null);
      } else {
        selectVan('od', card.dataset.vehicleId || null, card.dataset.driver || null);
      }
    });

    // ---- Status display helpers ----
    const STATUS_LABELS = { inProgress: 'In Progress', scheduled: 'Scheduled', completed: 'Completed', cancelled: 'Cancelled' };
    function humanizeStatus(s) { return STATUS_LABELS[s] || s || '—'; }

    // ---- Smooth marker position updates (mirrors testmap.js's animateMarkerTo) ----
    // Vehicle fixes land every ~10s; without this the markers teleport. Linear lerp
    // over ~1s -- a van moves at roughly constant speed between fixes, so easing would
    // read as odd deceleration. Snaps instead of animating when the tab's hidden, the
    // OS asks for reduced motion, there's no prior position, or the move is negligible.
    const _markerAnims = new WeakMap();      // marker -> pending rAF id
    const _reduceMotionMq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
    const MARKER_SMOOTH_MS = 1000;
    function animateMarkerTo(marker, latlng) {
      if (!marker || !latlng) return;
      const end = L.latLng(Array.isArray(latlng) ? latlng : [latlng.lat, latlng.lng]);
      if (!end || Number.isNaN(end.lat) || Number.isNaN(end.lng)) return;
      const pending = _markerAnims.get(marker);
      if (pending) { cancelAnimationFrame(pending); _markerAnims.delete(marker); }
      const start = marker.getLatLng();
      if (!start
          || typeof requestAnimationFrame !== 'function'
          || document.hidden
          || (_reduceMotionMq && _reduceMotionMq.matches)
          || (Math.abs(start.lat - end.lat) < 1e-7 && Math.abs(start.lng - end.lng) < 1e-7)) {
        marker.setLatLng(end);
        return;
      }
      const t0 = performance.now();
      const s = { lat: start.lat, lng: start.lng };
      const step = (now) => {
        if (!marker._map) { _markerAnims.delete(marker); return; } // marker was removed mid-glide
        const t = Math.min((now - t0) / MARKER_SMOOTH_MS, 1);
        marker.setLatLng([s.lat + t * (end.lat - s.lat), s.lng + t * (end.lng - s.lng)]);
        if (t < 1) _markerAnims.set(marker, requestAnimationFrame(step));
        else _markerAnims.delete(marker);
      };
      _markerAnims.set(marker, requestAnimationFrame(step));
    }

    // ---- Smooth heading changes (mirrors testmap: rotate via CSS transform + transition) ----
    // The bus-body SVG carries its rotation as an inline `transform: rotate()` with a CSS
    // transition, so a heading change just re-sets that value on the *existing* element and
    // it animates -- but only if we don't swap the whole icon. So .setIcon() (which replaces
    // the DOM node) runs only when the van's colour actually changes; otherwise we rotate.
    const _busIconColor = new Map();       // marker-key -> colour last baked into the icon
    const _markerHeadingDeg = new WeakMap(); // bus-body marker -> continuous (unwrapped) deg applied
    function _shortestHeadingDelta(from, to) {
      let d = ((((to - from) % 360) + 360) % 360);
      if (d > 180) d -= 360;               // take the short way round (350->10 = +20, not -340)
      return d;
    }
    function setBusMarkerHeading(marker, bearing) {
      if (!marker || !Number.isFinite(bearing)) return;
      const el = marker.getElement && marker.getElement();
      const svg = el && el.querySelector && el.querySelector('svg');
      if (!svg) return;                    // not rendered yet -- initial angle is baked into the icon
      const prev = _markerHeadingDeg.has(marker) ? _markerHeadingDeg.get(marker) : bearing;
      const next = prev + _shortestHeadingDelta(prev, bearing);
      _markerHeadingDeg.set(marker, next);
      svg.style.transform = `rotate(${next}deg)`;
    }
    // Update a bus-body marker: full icon swap only when colour or moving/stopped state
    // changed (both are baked into the SVG); otherwise just rotate.
    function updateBusBody(marker, key, bearing, color, stopped) {
      const iconKey = `${color}|${stopped ? 1 : 0}`;
      if (_busIconColor.get(key) !== iconKey) {
        _busIconColor.set(key, iconKey);
        _markerHeadingDeg.delete(marker);
        marker.setIcon(makeBusMarkerIcon(bearing, color, stopped));
        _markerHeadingDeg.set(marker, bearing);
      } else {
        setBusMarkerHeading(marker, bearing);
      }
    }

    // ---- Upsert van marker (bus body + bubble label) ----
    function upsertVehicleMarker(locData) {
      const loc = locData.location;
      if (!loc || !loc.coordinates) return;
      const [lng, lat] = loc.coordinates;
      const vid = locData.vehicleId;
      const bearing = locData.bearing ?? 0;

      // Keep vehicleData location in sync (dutyId in particular -- selectVan needs it)
      if (vehicleData[vid]) vehicleData[vid].currentLocation = locData;

      const v = vehicleData[vid] || {};
      const label = v.identifier || 'Van';
      // v.markerColor is computed server-side in /api/spare/vehicles: the same physical
      // van's real color on file in OnDemand, falling back to the /van-colors admin map,
      // then a default purple — see app.py's api_spare_vehicles(). vanColors here is just
      // a faster-polled (60s vs 120s) client-side mirror of that same admin override map.
      const spareColor = getVanColor(label, v.markerColor || '#7c3aed');
      const bubbleIcon = createBubbleIcon(label, spareColor, bearing);
      // Moving vs stopped -- testmap's threshold: <= 1 mph, and unknown speed = moving.
      const rawSpeedMs = locData.speed ?? locData.groundSpeed ?? locData.speedMs ?? null;
      const speedMph = rawSpeedMs != null ? rawSpeedMs * 2.23694 : null;
      const stopped = speedMph != null && speedMph <= 1;

      if (vehicleMarkers[vid]) {
        updateBusBody(vehicleMarkers[vid], vid, bearing, spareColor, stopped);
        animateMarkerTo(vehicleMarkers[vid], [lat, lng]);
        bubbleMarkers[vid].setIcon(bubbleIcon);
        animateMarkerTo(bubbleMarkers[vid], [lat, lng]);
      } else {
        vehicleMarkers[vid] = L.marker([lat, lng], { icon: makeBusMarkerIcon(bearing, spareColor, stopped) })
          // No popup -- it covered the map and duplicated info the Duty Roster / Active
          // Trips panels already show. Selecting a van (matches Spare's own admin panel:
          // open one duty, see its full route) instead highlights its duty/shift card and
          // ride cards and shows its full route; deselecting (click elsewhere, or the same
          // van again) clears both.
          .on('click', (e) => { L.DomEvent.stopPropagation(e); selectVan('spare', vid); })
          .addTo(map);
        _busIconColor.set(vid, `${spareColor}|${stopped ? 1 : 0}`);
        _markerHeadingDeg.set(vehicleMarkers[vid], bearing);
        bubbleMarkers[vid] = L.marker([lat, lng], { icon: bubbleIcon, interactive: false }).addTo(map);
      }

      // Speed bubble — show if Spare provides speed in the location payload (m/s → mph)
      if (speedMph != null && speedMph >= 0) {
        const speedIcon = createSpeedBubbleIcon(speedMph, spareColor, bearing);
        if (speedMarkers[vid]) {
          speedMarkers[vid].setIcon(speedIcon);
          animateMarkerTo(speedMarkers[vid], [lat, lng]);
        } else {
          speedMarkers[vid] = L.marker([lat, lng], { icon: speedIcon, interactive: false }).addTo(map);
        }
      } else if (speedMarkers[vid]) {
        map.removeLayer(speedMarkers[vid]);
        delete speedMarkers[vid];
      }

      // Mirror Spare's admin panel: while this van is the selected one, re-fetch and
      // redraw its route on every position update so the drawn path tracks the van as
      // it moves. fit:false so the map doesn't lurch on each tick.
      if (selectedVan && selectedVan.source === 'spare' && selectedVan.id === vid) {
        showVanFullRoute(vid, { fit: false });
      }
    }

    // ---- OnDemand marker upsert ----
    function upsertOdMarker(v) {
      const key     = 'od_' + v.vehicleId;
      const lat     = v.lat, lng = v.lng;
      const bearing = v.heading ?? 0;
      const label   = parseOdCallName(v.callName) || 'Van';
      const color   = getVanColor(label, v.markerColor || '#ec4899');
      const bubbleIcon = createBubbleIcon(label, color, bearing);
      const stopped = typeof v.speed === 'number' && v.speed <= 1;   // v.speed is mph
      if (odVehicleMarkers[key]) {
        updateBusBody(odVehicleMarkers[key], key, bearing, color, stopped);
        animateMarkerTo(odVehicleMarkers[key], [lat, lng]);
        odBubbleMarkers[key].setIcon(bubbleIcon);
        animateMarkerTo(odBubbleMarkers[key], [lat, lng]);
      } else {
        odVehicleMarkers[key] = L.marker([lat, lng], { icon: makeBusMarkerIcon(bearing, color, stopped) })
          // No popup (see Spare markers above for why) -- selecting an OD van highlights
          // its shift row + ride cards and draws its route (leg-routed through its
          // ordered stops, since OnDemand has no server-side route polyline).
          .on('click', (e) => { L.DomEvent.stopPropagation(e); selectVan('od', v.vehicleId, normalizeName(v.driverName)); })
          .addTo(map);
        _busIconColor.set(key, `${color}|${stopped ? 1 : 0}`);
        _markerHeadingDeg.set(odVehicleMarkers[key], bearing);
        odBubbleMarkers[key] = L.marker([lat, lng], { icon: bubbleIcon, interactive: false }).addTo(map);
      }
      if (typeof v.speed === 'number' && v.speed >= 0) {
        const speedIcon = createSpeedBubbleIcon(v.speed, color, bearing);
        if (odSpeedMarkers[key]) {
          odSpeedMarkers[key].setIcon(speedIcon);
          animateMarkerTo(odSpeedMarkers[key], [lat, lng]);
        } else {
          odSpeedMarkers[key] = L.marker([lat, lng], { icon: speedIcon, interactive: false }).addTo(map);
        }
      } else if (odSpeedMarkers[key]) {
        map.removeLayer(odSpeedMarkers[key]);
        delete odSpeedMarkers[key];
      }
    }

    function removeOdMarker(key) {
      if (odVehicleMarkers[key]) { map.removeLayer(odVehicleMarkers[key]); delete odVehicleMarkers[key]; }
      if (odBubbleMarkers[key])  { map.removeLayer(odBubbleMarkers[key]);  delete odBubbleMarkers[key]; }
      if (odSpeedMarkers[key])   { map.removeLayer(odSpeedMarkers[key]);   delete odSpeedMarkers[key]; }
    }

    // ---- OnDemand fetch + poll ----
    async function fetchOnDemand() {
      let res;
      try {
        res = await fetch('/api/ondemand');
      } catch (err) {
        // Network failure — keep last known state silently
        return;
      }
      if (res.status === 403 || res.status === 401) return; // not logged in — silent
      if (!res.ok) return; // any other error — keep last known state

      let data;
      try {
        data = await res.json();
      } catch (err) {
        return; // malformed response — keep last known state
      }

      const vehicles = Array.isArray(data.vehicles) ? data.vehicles : [];
      const active = new Set();
      const freshStops = [];
      const freshVehicles = [];

      for (const v of vehicles) {
        if (!v.vehicleId || v.lat == null || v.lng == null) continue;
        // Skip decommissioned vehicles
        const lastActive = v.lastActiveAt || v.last_active_at;
        if (lastActive) {
          if ((Date.now() - new Date(lastActive).getTime()) / 86400000 > 3) continue;
        } else if (v.stale) {
          continue;
        }
        upsertOdMarker(v);
        active.add('od_' + v.vehicleId);

        // Extract stops for the trip board
        const odLabel = parseOdCallName(v.callName) || 'Van';
        const odColor = getVanColor(odLabel, v.markerColor || '#ec4899');
        const rideIds = new Set();
        for (const stop of (v.stops || [])) {
          if (stop.rideId) rideIds.add(stop.rideId);
          freshStops.push({
            ...stop,
            vehicleId: v.vehicleId,
            vehicleName: odLabel,
            vehicleColor: odColor,
          });
        }
        freshVehicles.push({
          vehicleId: v.vehicleId,
          driverName: v.driverName || '',
          label: odLabel,
          color: odColor,
          rideCount: rideIds.size,
        });
      }

      // Remove markers for vans that left the response
      for (const key of Object.keys(odVehicleMarkers)) {
        if (!active.has(key)) removeOdMarker(key);
      }

      odStops = freshStops;
      odVehicles = freshVehicles;
      document.getElementById('od-count').textContent = active.size;
      renderTrips();
      renderStopOrderMarkers();
      renderDuties();

      // Same as the Spare markers: while an OD van is selected, re-draw its route each
      // poll so the path tracks it as it moves. fit:false so the map doesn't lurch.
      if (selectedVan && selectedVan.source === 'od' && selectedVan.id) {
        showOdVanRoute(selectedVan.id, { fit: false });
      }
    }

    // ---- Load vehicle roster (populates vehicleData + initial map pins) ----
    async function loadVehicleIdents() {
      try {
        const res = await fetch('/api/spare/vehicles');
        if (!res.ok) return;
        const vehicles = await res.json();
        (Array.isArray(vehicles) ? vehicles : []).forEach(v => {
          if (!v.id) return;
          vehicleData[v.id] = v;
          if (v.currentLocation) upsertVehicleMarker({ ...v.currentLocation, vehicleId: v.id });
        });
      } catch (e) { /* ignore */ }
    }

    // ---- SSE ----
    const sseDot   = document.getElementById('sse-dot');
    const sseLabel = document.getElementById('sse-label');

    function connectSSE() {
      const es = new EventSource('/stream/spare');
      es.onopen = () => { sseDot.className = 'dot live'; sseLabel.textContent = 'Live'; };
      es.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'initial') {
          (msg.data.vehicleLocations || []).forEach(upsertVehicleMarker);
          if (!msg.data.webhookConfigured) {
            document.getElementById('webhook-badge').style.display = '';
            document.getElementById('map-no-webhooks').style.display = 'block';
          }
        } else if (msg.type === 'vehicleLocation') {
          upsertVehicleMarker(msg.data);
          document.getElementById('map-no-webhooks').style.display = 'none';
          document.getElementById('webhook-badge').style.display = 'none';
        } else if (msg.type === 'requestStatus') {
          fetchTrips();
        }
      };
      es.onerror = () => {
        sseDot.className = 'dot off';
        sseLabel.textContent = 'Disconnected — reconnecting…';
        es.close();
        setTimeout(connectSSE, 5000);
      };
    }
    connectSSE();

    // ---- Trip board (Spare requests + OnDemand stops) ----
    let spareTrips = [];
    let odStops    = [];  // extracted from ondemand vehicle stop plans
    let odVehicles = [];  // live OnDemand vans this poll: { vehicleId, driverName, label, color, rideCount }

    // OD rideStatus values we consider active (skip completed/cancelled)
