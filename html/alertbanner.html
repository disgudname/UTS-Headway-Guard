<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UVA Alert Banner</title>
<!--
  Scrolling strip for a signage zone (e.g. the bottom of a 1920x1080 screen).
  Shows UVA's emergency alerts (Rave CAP, via /v1/uva-alerts) scrolling right-to-left.
  Everything scales to the window height, so size the zone and the page fills it.
  ?speed=  scroll speed in pixels per second (default 180)
  ?poll=   seconds between checks (default 15)
  ?idle=   text to show (still) when there is no alert; default is a plain dark bar
  ?test=1  show a sample alert
-->
<style>
  :root { --bg: #0b0f14; --alert: #b3001b; --alert-dark: #7a0012; --fg: #fff; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: "Helvetica Neue", Arial, sans-serif; }
  #bar { position: absolute; inset: 0; display: flex; align-items: stretch; }
  #label { flex: none; display: none; align-items: center; padding: 0 0.6em; background: var(--alert-dark);
    font-weight: 800; letter-spacing: 0.04em; white-space: nowrap; z-index: 1;
    box-shadow: 0.3em 0 0.5em rgba(0,0,0,0.45); }
  #label .dot { width: 0.55em; height: 0.55em; border-radius: 50%; background: #fff; margin-right: 0.45em;
    animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }
  #track { position: relative; flex: 1; overflow: hidden; }
  #scroller { position: absolute; top: 0; bottom: 0; left: 0; display: flex; align-items: center;
    white-space: nowrap; will-change: transform; font-weight: 700; }
  #scroller span.sep { opacity: 0.6; padding: 0 1.2em; }
  #idle { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: #9aa4b2; font-weight: 600; }
  body.alerting { background: var(--alert); }
  body.alerting #label { display: flex; }
</style>
</head>
<body>
<div id="bar">
  <div id="label"><span class="dot"></span>UVA ALERT</div>
  <div id="track"><div id="scroller"></div></div>
  <div id="idle"></div>
</div>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const SPEED = Math.max(20, Number(qs.get("speed")) || 180);
  const POLL_MS = Math.max(5, Number(qs.get("poll")) || 15) * 1000;
  const IDLE = qs.get("idle") || "";
  const TEST = qs.get("test") === "1";

  const body = document.body;
  const scroller = document.getElementById("scroller");
  const track = document.getElementById("track");
  const idle = document.getElementById("idle");

  let currentText = null;
  let x = 0, loopWidth = 0, last = 0;

  function sizeFonts() {
    const h = window.innerHeight;
    scroller.style.fontSize = Math.round(h * 0.55) + "px";
    document.getElementById("label").style.fontSize = Math.round(h * 0.42) + "px";
    idle.style.fontSize = Math.round(h * 0.4) + "px";
    if (currentText) build(currentText);
  }

  // Lay the message out enough times to cover the strip twice, then scroll by one copy and wrap.
  function build(text) {
    scroller.textContent = "";
    const one = document.createElement("span");
    one.textContent = text;
    scroller.appendChild(one);
    const sep = document.createElement("span");
    sep.className = "sep";
    sep.textContent = "◆";
    scroller.appendChild(sep);
    loopWidth = one.offsetWidth + sep.offsetWidth;
    const copies = Math.ceil((track.clientWidth * 2) / loopWidth) + 1;
    for (let i = 1; i < copies; i++) {
      scroller.appendChild(one.cloneNode(true));
      scroller.appendChild(sep.cloneNode(true));
    }
  }

  function show(text) {
    if (text === currentText) return;
    currentText = text;
    if (text) {
      body.classList.add("alerting");
      idle.style.display = "none";
      track.style.display = "";
      build(text);
      x = track.clientWidth;  // a new alert enters from the right edge
    } else {
      body.classList.remove("alerting");
      scroller.textContent = "";
      track.style.display = "none";
      idle.textContent = IDLE;
      idle.style.display = IDLE ? "flex" : "none";
    }
  }

  function frame(t) {
    const dt = last ? Math.min(0.1, (t - last) / 1000) : 0;
    last = t;
    if (currentText && loopWidth) {
      x -= SPEED * dt;
      if (x <= -loopWidth) x += loopWidth;
      scroller.style.transform = `translateX(${x.toFixed(1)}px)`;
    }
    requestAnimationFrame(frame);
  }

  async function poll() {
    if (TEST) {
      show("UVA Emergency Alert: TEST - Fire Activity at Rice Hall, 85 Engineer's Way. Avoid the area.");
      return;
    }
    try {
      const r = await fetch("/v1/uva-alerts", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      const texts = (data.alerts || []).map(a => a.description || a.headline).filter(Boolean);
      show(texts.join("   ◆   "));
    } catch (e) {
      // Network blip: keep whatever is showing until the next poll.
    }
  }

  window.addEventListener("resize", sizeFonts);
  sizeFonts();
  show("");
  poll();
  setInterval(poll, POLL_MS);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
