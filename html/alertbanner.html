<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UVA Alert Banner</title>
<!--
  Scrolling strip for a signage zone (e.g. the bottom of a 1920x1080 screen).
  Shows UVA's emergency alerts (Rave CAP, via /v1/uva-alerts) scrolling right-to-left.
  Everything scales to the window height, so size the zone and the page fills it.
  ?speed=  scroll speed in pixels per second (default 180)
  ?poll=   seconds between checks (default 15)
  ?idle=   text to show (still) when there is no alert; otherwise the page is fully transparent
  ?test=1  show a sample alert

  Written for old WebKit on purpose (Yodeck's WebKit renderer is the one that does
  transparency): ES5 only, XMLHttpRequest, no CSS variables, no flexbox, no inset.
-->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: transparent; color: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif; }
  body.alerting { background: #DF1E43; }
  #label { position: absolute; left: 0; top: 0; bottom: 0; display: none; padding: 0 0.6em;
    background: #A3132F; font-weight: bold; letter-spacing: 0.04em; white-space: nowrap; z-index: 2;
    -webkit-box-shadow: 0.3em 0 0.5em rgba(0,0,0,0.45); box-shadow: 0.3em 0 0.5em rgba(0,0,0,0.45); }
  #label .dot { display: inline-block; width: 0.55em; height: 0.55em; border-radius: 50%;
    -webkit-border-radius: 50%; background: #fff; margin-right: 0.45em; vertical-align: middle;
    position: relative; top: -0.08em; }
  #track { position: absolute; top: 0; bottom: 0; right: 0; left: 0; overflow: hidden; z-index: 1; }
  #scroller { position: absolute; top: 0; left: 0; white-space: nowrap; font-weight: bold; }
  #scroller span { display: inline-block; }
  #scroller span.sep { opacity: 0.6; padding: 0 1.2em; }
  #idle { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; text-align: center;
    color: #9aa4b2; font-weight: bold; }
  body.alerting #label { display: block; }
</style>
</head>
<body>
<div id="label"><span class="dot" id="dot"></span>UVA ALERT</div>
<div id="track"><div id="scroller"></div></div>
<div id="idle"></div>
<script>
(function () {
  function param(name) {
    var m = new RegExp("[?&]" + name + "=([^&#]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
  }
  var SPEED = Math.max(20, Number(param("speed")) || 180);
  var POLL_MS = Math.max(5, Number(param("poll")) || 15) * 1000;
  var IDLE = param("idle");
  var TEST = param("test") === "1";

  var body = document.body;
  var label = document.getElementById("label");
  var dot = document.getElementById("dot");
  var track = document.getElementById("track");
  var scroller = document.getElementById("scroller");
  var idle = document.getElementById("idle");

  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
    function (cb) { return window.setTimeout(cb, 16); };
  function now() {
    return (window.performance && window.performance.now) ? window.performance.now() : new Date().getTime();
  }

  var currentText = null;
  var x = 0, loopWidth = 0, last = 0;

  function setX(px) {
    var t = "translate3d(" + px.toFixed(1) + "px,0,0)";
    scroller.style.webkitTransform = t;
    scroller.style.transform = t;
  }

  function layout() {
    var h = window.innerHeight || document.documentElement.clientHeight;
    scroller.style.fontSize = Math.round(h * 0.55) + "px";
    scroller.style.lineHeight = h + "px";
    scroller.style.height = h + "px";
    label.style.fontSize = Math.round(h * 0.42) + "px";
    label.style.lineHeight = h + "px";
    idle.style.fontSize = Math.round(h * 0.4) + "px";
    idle.style.lineHeight = h + "px";
    track.style.left = (currentText ? label.offsetWidth : 0) + "px";
    if (currentText) build(currentText);
  }

  // Lay the message out enough times to cover the strip twice, then scroll by one copy and wrap.
  function build(text) {
    scroller.innerHTML = "";
    var one = document.createElement("span");
    one.appendChild(document.createTextNode(text));
    var sep = document.createElement("span");
    sep.className = "sep";
    sep.appendChild(document.createTextNode("◆"));
    scroller.appendChild(one);
    scroller.appendChild(sep);
    loopWidth = one.offsetWidth + sep.offsetWidth;
    if (loopWidth < 1) return;
    var copies = Math.ceil((track.clientWidth * 2) / loopWidth) + 1;
    for (var i = 1; i < copies; i++) {
      scroller.appendChild(one.cloneNode(true));
      scroller.appendChild(sep.cloneNode(true));
    }
  }

  function show(text) {
    if (text === currentText) return;
    currentText = text;
    if (text) {
      body.className = "alerting";
      idle.style.display = "none";
      track.style.display = "block";
      track.style.left = label.offsetWidth + "px";
      build(text);
      x = track.clientWidth;  // a new alert enters from the right edge
      setX(x);
    } else {
      body.className = "";
      scroller.innerHTML = "";
      loopWidth = 0;
      track.style.display = "none";
      idle.innerHTML = "";
      idle.appendChild(document.createTextNode(IDLE));
      idle.style.display = IDLE ? "block" : "none";
    }
  }

  function frame() {
    var t = now();
    var dt = last ? Math.min(0.1, (t - last) / 1000) : 0;
    last = t;
    if (currentText && loopWidth) {
      x -= SPEED * dt;
      if (x <= -loopWidth) x += loopWidth;
      setX(x);
    }
    raf(frame);
  }

  // The dot blinks from JS rather than a CSS animation, which old WebKit may not run.
  var dotOn = true;
  window.setInterval(function () {
    dotOn = !dotOn;
    dot.style.opacity = dotOn ? "1" : "0.15";
  }, 600);

  function poll() {
    if (TEST) {
      show("UVA Emergency Alert: TEST - Fire Activity at Rice Hall, 85 Engineer's Way. Avoid the area.");
      return;
    }
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/v1/uva-alerts?_=" + new Date().getTime(), true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      // Network blip or bad answer: keep whatever is showing until the next poll.
      if (xhr.status !== 200) return;
      var data;
      try { data = JSON.parse(xhr.responseText); } catch (e) { return; }
      var alerts = (data && data.alerts) || [];
      var texts = [];
      for (var i = 0; i < alerts.length; i++) {
        var t = alerts[i].description || alerts[i].headline;
        if (t) texts.push(t);
      }
      show(texts.join("   ◆   "));
    };
    xhr.send();
  }

  window.onresize = layout;
  show("");
  layout();
  poll();
  window.setInterval(poll, POLL_MS);
  raf(frame);
})();
</script>
</body>
</html>
