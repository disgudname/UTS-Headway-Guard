<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTS Block Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* One "baseball card" per UTS block. The data is baked in by scripts/build_block_cards.py
     (between the BLOCKCARDS-DATA markers at the bottom); nothing is fetched at runtime. */
  :root {
    --bg: #1b1a3a;
    --text: #ffffff;
    --muted: #aeb6d0;
    --accent: #f58a2e;
    --paper: #f3ead6;
    --paper-edge: #e2d5b8;
    --ink: #2a2620;
    --ink-soft: #6b6355;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(80% 60% at 50% 0%, #2c2b5c, var(--bg) 70%) fixed, var(--bg);
    color: var(--text);
    font-family: 'Roboto Condensed', system-ui, sans-serif;
    min-height: 100vh;
  }
  header { text-align: center; padding: 28px 16px 8px; }
  h1 { font-family: 'Alfa Slab One', serif; font-weight: 400; font-size: 38px; letter-spacing: 1px; margin: 0; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 6px 0 0; font-size: 16px; }
  .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 16px 16px 4px; }
  .filters button {
    font: 700 14px 'Roboto Condensed', sans-serif; letter-spacing: .6px; text-transform: uppercase;
    color: var(--text); background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.14);
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .filters button.on { background: var(--chip, var(--accent)); border-color: var(--chip, var(--accent)); color: var(--chip-ink, #fff); }
  .tools { text-align: center; padding: 8px 16px 0; }
  .tools button { background: none; border: 0; color: var(--muted); font: 500 14px 'Roboto Condensed', sans-serif; text-decoration: underline; cursor: pointer; }

  #cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 26px; padding: 22px 16px 40px; max-width: 1400px; margin: 0 auto; }
  .card { width: 300px; height: 420px; perspective: 1400px; cursor: pointer; border: 0; padding: 0; background: none; color: inherit; font: inherit; text-align: left; }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; border-radius: 16px; }
  .inner { position: relative; width: 100%; height: 100%; transition: transform .6s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; }
  .card.flipped .inner { transform: rotateY(180deg); }
  .card:hover .inner { transform: translateY(-4px) rotateY(0deg); }
  .card.flipped:hover .inner { transform: translateY(-4px) rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 14px; overflow: hidden; background: var(--paper); color: var(--ink);
    box-shadow: 0 10px 24px rgba(0,0,0,.45), inset 0 0 0 1px var(--paper-edge);
  }
  .back { transform: rotateY(180deg); }

  /* Front */
  .front { padding: 12px; display: flex; flex-direction: column; }
  .photo { position: relative; flex: 1; border-radius: 6px; overflow: hidden; background: var(--c); border: 3px solid var(--ink); }
  .photo svg.route { position: absolute; inset: 0; width: 100%; height: 100%; }
  .photo .num {
    position: absolute; left: 12px; bottom: -6px; font-family: 'Alfa Slab One', serif; font-size: 132px; line-height: 1;
    color: var(--c-ink); text-shadow: 3px 3px 0 rgba(0,0,0,.18);
  }
  .photo .role {
    position: absolute; top: 10px; right: -34px; transform: rotate(35deg); width: 150px; text-align: center;
    background: var(--ink); color: var(--paper); font-weight: 700; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; padding: 4px 0;
  }
  .photo .role.long { font-size: 9.5px; letter-spacing: .3px; }
  .photo .uts { position: absolute; top: 9px; left: 10px; font-weight: 700; font-size: 12px; letter-spacing: 2px; color: var(--c-ink); opacity: .8; }
  .photo .leader {
    position: absolute; right: 8px; bottom: 8px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 50%;
    width: 62px; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font-weight: 700; font-size: 9px; line-height: 1.05; letter-spacing: .5px; text-transform: uppercase; transform: rotate(-10deg);
  }
  .photo .leader b { font-family: 'Alfa Slab One', serif; font-weight: 400; font-size: 13px; }
  .plate { padding: 9px 4px 2px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .plate .name { font-family: 'Alfa Slab One', serif; font-size: 25px; letter-spacing: .5px; }
  .plate .team { font-weight: 700; font-size: 14px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; }
  .strip { display: flex; gap: 6px; padding: 4px 4px 0; font-size: 13px; color: var(--ink-soft); justify-content: space-between; }
  .strip b { color: var(--ink); }

  /* Back */
  .back { padding: 12px 14px; display: flex; flex-direction: column; font-size: 13px; }
  .bhead { display: flex; align-items: center; gap: 10px; border-bottom: 3px solid var(--ink); padding-bottom: 7px; }
  .bnum { font-family: 'Alfa Slab One', serif; font-size: 26px; background: var(--c); color: var(--c-ink); border: 2px solid var(--ink); border-radius: 50%; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; flex: none; }
  .bhead .t1 { font-family: 'Alfa Slab One', serif; font-size: 18px; line-height: 1; }
  .bhead .t2 { font-weight: 700; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-soft); margin-top: 3px; }
  .vitals { margin: 7px 0 4px; display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; }
  .vitals dt { font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: .8px; color: var(--ink-soft); padding-top: 1px; }
  .vitals dd { margin: 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; font-variant-numeric: tabular-nums; }
  th { font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase; background: var(--ink); color: var(--paper); padding: 3px 4px; text-align: right; font-weight: 700; }
  td { padding: 3px 4px; text-align: right; border-bottom: 1px solid var(--paper-edge); }
  th:first-child, td:first-child { text-align: left; font-weight: 700; }
  tr.total td { border-top: 2px solid var(--ink); border-bottom: 0; font-weight: 700; }
  .hours { margin-top: 7px; }
  .hours .lbl { font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: .8px; color: var(--ink-soft); display: flex; justify-content: space-between; }
  .hours svg { display: block; width: 100%; height: 40px; margin-top: 2px; }
  .fact { margin-top: auto; border-top: 2px dotted var(--ink-soft); padding-top: 6px; font-style: italic; line-height: 1.25; }
  .fact b { font-style: normal; }

  footer { color: var(--muted); font-size: 13px; text-align: center; max-width: 760px; margin: 0 auto; padding: 0 16px 36px; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { .inner { transition: none; } }
  @media print {
    body { background: #fff; } header .sub, .filters, .tools, footer { display: none; }
    .card { break-inside: avoid; }
  }
</style>
</head>

const HANDOFFS = {

  '05': 'Never goes home at 22:00: it turns into <b>Night Pilot [03]</b> at the Library, every night.',

  '04': 'Was <b>Green [01]</b> all day. Only comes out Thursday to Saturday nights.',

  '06': 'Called up from the minors: starts the morning as <b>Purple [19]</b>, flips to Orange at 08:25.',

function inkFor(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;

function decodePolyline(str) {
  const pts = []; let i = 0, lat = 0, lng = 0;
  while (i < str.length) {
    for (const which of [0, 1]) {

// The block's route lines, fitted into the top part of the card's picture box: the variant it runs most is bold,
// any other variant it runs is a faint ghost behind it, all on one scale so they line up.
function routeSvg(c, ink) {
  const lines = (c.routes || []).map(id => decodePolyline(DATA.shapes[id] || '')).filter(p => p.length);
  if (!lines.length) return '';
  const k = Math.cos(lines[0][0][0] * Math.PI / 180), all = lines.flat();
  const X = p => p[1] * k, Y = p => -p[0];
  const x0 = Math.min(...all.map(X)), x1 = Math.max(...all.map(X)), y0 = Math.min(...all.map(Y)), y1 = Math.max(...all.map(Y));
  const W = 270, H = 300, box = {x: 22, y: 34, w: 226, h: 150};
  const sc = Math.min(box.w / (x1 - x0 || 1), box.h / (y1 - y0 || 1));
  const ox = box.x + (box.w - (x1 - x0) * sc) / 2, oy = box.y + (box.h - (y1 - y0) * sc) / 2;
  const path = pts => pts.map((p, i) => (i ? 'L' : 'M') + (ox + (X(p) - x0) * sc).toFixed(1) + ' ' + (oy + (Y(p) - y0) * sc).toFixed(1)).join('');
  const ghosts = lines.slice(1).map(l => `<path d="${path(l)}" fill="none" stroke="${ink}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".38"/>`).join('');
  const d = path(lines[0]);
  return `<svg class="route" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${ghosts}
    <path d="${d}" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" transform="translate(2 3)"/>
    <path d="${d}" fill="none" stroke="${ink}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".92"/></svg>`;
}

function role(c) {
  const w = c.rows.wkd, pieces = w ? w.pieces : [];
  if (c.family === 'Night Pilot') return 'Closer';
  if (c.block === '10' || c.block === '06') return 'Call-up';
  if (c.block === '17' || c.block === '19') return 'Two-way';
  if (pieces.length > 1) return 'Doubleheader';
  if (pieces.length && pieces[0][0] >= 12 * 3600) return 'Reliever';
  return (c.rows.sat || c.rows.sun) ? 'Everyday' : 'Starter';
}
function runs(c) {
  const r = c.rows;
  if (r.wkd && r.wkd.days === 5 && r.sat && r.sun) return 'Every day';
  if (r.wkd && r.wkd.days === 5) return 'Monday to Friday';
  if (r.wkd && r.sat) return 'Thursday to Saturday';
  return Object.keys(r).map(k => KIND_LABEL[k]).join(', ');
}
// A day's lineup: each stretch with the route variant it runs ("07:30-17:45 Day, 17:45-22:00 Loop").
function piecesText(row) {
  return row.lineup.map(p => {
    const label = DATA.variants[p[2]];
    return clock(p[0]) + '&ndash;' + clock(p[1]) + (label ? ' ' + label : '');
  }).join(', ');
}

// League leaders: one badge per card, the most impressive title it holds.
function leaders(cards) {
  const titles = [
    ['Riders', c => c.rows.wkd && c.rows.wkd.riders],
    ['Riders / hr', c => c.rows.wkd && c.rows.wkd.per_hour],
    ['Miles', c => c.rows.wkd && c.rows.wkd.miles],
    ['Hours', c => c.week_hours]
  ];
  const out = {};
  for (const [title, get] of titles) {
    const best = cards.filter(c => get(c)).sort((a, b) => get(b) - get(a))[0];
    if (best && !out[best.block]) out[best.block] = title;
  }
  return out;
}

function hourBars(c) {
  // Service-day order, 04:00 first, so Night Pilot's after-midnight hours sit at the end.
  const hours = []; for (let i = 0; i < 24; i++) hours.push((i + 4) % 24);
  const vals = hours.map(h => c.by_hour[h] || 0), max = Math.max(...vals, 1);
  if (max <= 1) return '';
  const first = vals.findIndex(v => v > max * 0.02), last = vals.length - 1 - [...vals].reverse().findIndex(v => v > max * 0.02);
  const span = hours.slice(first, last + 1), sv = vals.slice(first, last + 1);
  const bw = 100 / span.length, peak = sv.indexOf(Math.max(...sv));
  const bars = sv.map((v, i) => `<rect x="${(i * bw + bw * .12).toFixed(2)}" y="${(34 - 32 * v / max).toFixed(1)}" width="${(bw * .76).toFixed(2)}" height="${(32 * v / max).toFixed(1)}" fill="${i === peak ? 'var(--ink)' : 'var(--ink-soft)'}" opacity="${i === peak ? 1 : .55}"/>`).join('');
  return `<div class="hours"><div class="lbl"><span>Boardings by hour, ${String(span[0]).padStart(2, '0')}:00&ndash;${String((span[span.length - 1] + 1) % 24).padStart(2, '0')}:00</span><span>peak ${String(span[peak]).padStart(2, '0')}:00</span></div>
    <svg viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true">${bars}</svg></div>`;
}

function fact(c) {
  if (HANDOFFS[c.block]) return HANDOFFS[c.block];
  if (c.best_day) {
    const d = new Date(c.best_day.date + 'T12:00:00');
    return `Career high: <b>${num(c.best_day.riders)} riders</b> on ${d.toLocaleDateString('en-US', {weekday: 'long', month: 'short', day: 'numeric'})}.`;

  return '';

function cardHtml(c, leader) {

  const first = Math.min(...kinds.map(k => c.rows[k].pieces[0][0]));
  const last = Math.max(...kinds.map(k => c.rows[k].pieces[c.rows[k].pieces.length - 1][1]));
  const rows = kinds.map(k => { const r = c.rows[k]; return `<tr><td>${KIND_LABEL[k]}</td><td>${r.days}</td><td>${r.hours.toFixed(1)}</td><td>${num(r.riders)}</td><td>${r.per_hour == null ? '&ndash;' : r.per_hour.toFixed(1)}</td><td>${num(r.miles)}</td></tr>`; }).join('');
  const weekMiles = kinds.reduce((s, k) => s + (c.rows[k].miles || 0) * c.rows[k].days, 0);
  const vit = [];
  vit.push(['Runs', runs(c)]);
  vit.push(['Weekday', c.rows.wkd ? piecesText(c.rows.wkd) : 'Off']);
  if (c.rows.sat || c.rows.sun) vit.push(['Weekend', piecesText(c.rows.sat || c.rows.sun)]);
  if (c.timestops) vit.push(['Timestops', esc(c.timestops.names.join(', ')) + ` &bull; ${c.timestops.count} a day`]);
  if (c.top_stop) vit.push(['Hot stop', esc(c.top_stop.name) + ` (${Math.round(c.top_stop.share * 100)}%)`]);
  if (c.usual_bus) vit.push(['Usual bus', esc(c.usual_bus.bus) + ` (${c.usual_bus.days} of ${c.usual_bus.of} days)`]);
  return `<button class="card" type="button" data-family="${esc(c.family)}" style="--c:${c.color};--c-ink:${ink}" aria-label="Block ${c.block}, ${TEAM[c.family]}. Flip card.">
    <div class="inner">
      <div class="face front">
        <div class="photo">
          ${routeSvg(c, ink)}
          <div class="uts">UVA TRANSIT</div>
          <div class="role${role(c).length > 9 ? ' long' : ''}">${role(c)}</div>
          <div class="num">${c.block}</div>
          ${leader ? `<div class="leader">League leader<b>${leader}</b></div>` : ''}
        </div>
        <div class="plate"><div class="name">BLOCK ${c.block}</div><div class="team">${TEAM[c.family]}</div></div>
        <div class="strip"><span><b>${clock(first)}</b> first out</span><span><b>${num(w.riders)}</b> riders/day</span><span><b>${clock(last)}</b> last in</span></div>
      </div>
      <div class="face back">
        <div class="bhead"><div class="bnum">${c.block}</div><div><div class="t1">BLOCK ${c.block}</div><div class="t2">${TEAM[c.family]} &bull; ${role(c)}</div></div></div>
        <dl class="vitals">${vit.map(v => `<dt>${v[0]}</dt><dd>${v[1]}</dd>`).join('')}</dl>
        <table>
          <tr><th>Day</th><th>Days</th><th>Hrs</th><th>Riders</th><th>R/Hr</th><th>Mi</th></tr>
          ${rows}
          <tr class="total"><td>Week</td><td>${kinds.reduce((s, k) => s + c.rows[k].days, 0)}</td><td>${c.week_hours.toFixed(1)}</td><td>${num(c.week_riders || null)}</td><td></td><td>${num(Math.round(weekMiles) || null)}</td></tr>
        </table>
        ${hourBars(c)}
        <div class="fact">${fact(c)}</div>
      </div>
    </div>
  </button>`;
}

function render() {
  const cards = DATA.cards, lead = leaders(cards);
  document.getElementById('count').textContent = cards.length;
  const el = document.getElementById('cards');
  el.innerHTML = cards.map(c => cardHtml(c, lead[c.block])).join('');
  el.addEventListener('click', e => { const card = e.target.closest('.card'); if (card) card.classList.toggle('flipped'); });

  const families = [...new Set(cards.map(c => c.family))];
  const filters = document.getElementById('filters');
  filters.innerHTML = '<button type="button" class="on" data-f="">All</button>' + families.map(f => {
    const color = cards.find(c => c.family === f).color;
    return `<button type="button" data-f="${esc(f)}" style="--chip:${color};--chip-ink:${inkFor(color)}">${TEAM[f]}</button>`;
  }).join('');
  filters.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    filters.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    el.querySelectorAll('.card').forEach(card => { card.style.display = (!b.dataset.f || card.dataset.family === b.dataset.f) ? '' : 'none'; });
  });
  document.getElementById('flipall').addEventListener('click', () => {
    const all = [...el.querySelectorAll('.card')], on = !all.every(c => c.classList.contains('flipped'));
    all.forEach(c => c.classList.toggle('flipped', on));
  });

  const day = s => new Date(s + 'T12:00:00').toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
  if (DATA.ridership_from) {
    document.getElementById('foot').innerHTML =
      `Hours come from TransLoc's block schedule for the week of ${day(DATA.schedule_week)}. Riders and miles are the middle (median) day from
       door-counter and GPS data, ${day(DATA.ridership_from)} to ${day(DATA.ridership_to)}, matched to blocks by which bus dispatch
       had on the block; a bus with a broken counter or a mid-day swap makes these rough. Purple blocks have no timestops.`;
  }
}
render();
</script>
</body>
</html>
