<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTS Bus Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/cards.css">
</head>
<body>
<!-- One baseball card per bus. Drawn by scripts/cards.js from scripts/cards-data.js (baked by scripts/build_block_cards.py). -->
<div id="nav"></div>
<header>
  <h1>UTS <span>Bus</span> Cards</h1>
  <p class="sub">Fall 2026 series &bull; collect all <span id="count"></span> &bull; tap a card to flip it</p>
</header>
<div class="filters" id="filters"></div>
<div class="tools"><button id="flipall" type="button">Flip all</button></div>
<main id="cards"></main>
<footer id="foot"></footer>
<script src="/scripts/cards-data.js"></script>
<script src="/scripts/cards.js"></script>
<script>Cards.gallery('bus');</script>
</body>
</html>
